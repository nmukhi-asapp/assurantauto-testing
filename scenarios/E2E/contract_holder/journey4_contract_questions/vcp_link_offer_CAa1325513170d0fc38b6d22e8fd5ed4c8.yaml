company_marker: assurantauto
customer:
  customer_id: CHI-021
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Tell the agent you want to know more about your contract and what it covers
  - If the agent offers to send you a link to the self-service portal, accept it and confirm you received it
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I'd like to know
    more about my contract and what's covered.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Inquisitive. Wants to be self-sufficient. Happy to use an online portal if offered.
description: Contract holder asking about their contract — agent must proactively offer the VCP portal link (vehiclecareplan.com)
  for self-service; must not mispronounce Assurant
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
- rules:
  - Agent does NOT mispronounce or misspell 'Assurant' in its responses
- rules:
  - Agent offers to send the VCP link via SMS if the customer accepts
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
