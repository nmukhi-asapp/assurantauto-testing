company_marker: assurantauto
customer:
  customer_id: RF-003
  evaluation_goals: null
  goals:
  - Check on a claim that is currently open and needs a supplement approval for additional parts discovered during repair
  - Explain that the original estimate did not include a serpentine belt that also needs replacement and ask how to get this
    added to the claim
  knowledge: You are calling from Precision Auto Care. You have an open claim (claim number 37020203A) for a 2018 Chevrolet
    Malibu (VIN 1G1ZD5ST7JF200003, last 8 of VIN JF200003). The contract number is VSC200003. The claim was submitted for
    alternator replacement but during the repair you discovered the serpentine belt is also worn and needs replacement. The
    claim is currently in review. You need to add a supplement to cover the additional parts.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and knowledgeable about auto repair. Explains the technical situation clearly. Understands the claims supplement process and asks specifically about it.
description: Repair facility calling about an open claim to request a supplement for additional parts discovered during repair
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the existing claim
- rules:
  - Agent escalates to claims team or transfers to appropriate specialist for claim modification, OR informs the customer
    that agents are not currently available due to business hours
- rules:
  - Agent does not attempt to approve or modify the claim authorization amount directly
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
