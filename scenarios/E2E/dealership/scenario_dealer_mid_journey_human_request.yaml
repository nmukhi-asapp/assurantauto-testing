company_marker: assurantauto
customer:
  customer_id: DLR-022
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are a Dealership
  - Ask to check payment status on a completed claim
  - If offered a portal link via text, decline and ask to handle it over the phone
  - Provide your claim number 37030022 when asked for an identifier
  - When the agent reads back the claim number and asks you to confirm, say yes
  - When the agent provides the payment status, acknowledge it — then immediately
    ask to speak to a live agent without explaining why
  - When the agent asks what you need help with, say you need to update the mailing
    address for the payment check — it was sent to the old address
  - Accept escalation to the appropriate team
  knowledge: You are calling from Metro Auto Group (dealer ID 000CA123). You completed
    repairs on a 2023 GMC Sierra (VIN 1GT0AAEK2PZ300022, last 8 PZ300022) under claim
    37030022, contract VSC300022. The claim is paid but the check was mailed to your
    old address. You need to redirect it. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Dealership service advisor who has completed
    the claim process but realized mid-call there is an address issue. Asks for a
    human without giving a reason — only explains when directly asked.
description: Dealership completes a payment status inquiry and then, without explanation,
  requests a live agent. Agent should ask what the caller needs before escalating,
  recognize the address update is outside IVR scope, and escalate via escalate_to_agent_from_ivr.
  Tests that the agent probes mid-conversation human requests rather than immediately
  acceding.
evaluations:
- rules:
  - Agent routes to the Dealership service flow after the caller identifies as a Dealership
- rules:
  - Agent looks up the claim using the claim number or other identifier provided
- rules:
  - Agent provides the payment status of the claim to the caller
- rules:
  - When the caller requests a live agent, the agent asks what they need help with
    before escalating
- rules:
  - Caller states they need to update a mailing address or redirect a payment
- rules:
  - Agent recognizes the address update cannot be handled through the IVR and escalates
    using escalate_to_agent_from_ivr, OR informs the customer that agents are not
    currently available due to business hours
- rules:
  - Agent informs the caller they will be connected to the appropriate team, OR informs
    the customer that agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Dealership: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS,
    NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS,
    DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
