company_marker: assurantauto
customer:
  customer_id: CHI-034
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Tell the agent you want to speak to a human agent because you have been charged incorrectly on your premium payment
  - If the agent tries to help you directly without escalating, insist that you need a person
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. You are being overcharged on your
    monthly premium. You believe there is a billing error on your account. Start by saying 'I want to speak to a real person
    — I have a billing problem.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Firm and direct. States the billing reason upfront. Does not want to be deflected by the IVR.
description: 'Contract holder immediately requests a human agent and states the reason upfront: a billing dispute / premium
  overcharge. Billing disputes are explicitly listed as an escalation trigger in ContractHolderIssues. Agent must recognize
  this is outside its scope and escalate via Unified Escalation Protocol with GAIntent=''PREMIUMS'', rather than attempting
  to resolve the billing issue directly.'
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr and successfully retrieves the customer's contract
- rules:
  - Agent does NOT attempt to resolve the billing dispute directly
- rules:
  - Agent escalates using escalate_to_agent_from_ivr, OR informs the customer that agents are not currently available due
    to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'PREMIUMS'
- rules:
  - Agent informs the customer they will be connected to the appropriate team, OR informs the customer that agents are not
    currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
id: e2e_edge_case_ch_human_request_billing_dispute
