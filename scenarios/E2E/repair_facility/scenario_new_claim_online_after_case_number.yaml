company_marker: assurantauto
customer:
  customer_id: RF-013
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you need to start a new claim and have not yet submitted the Repair Order
  - When the agent asks whether you prefer online or phone, say you prefer to handle
    it over the phone
  - When the agent explains online is faster or easier, insist you still want to
    do it over the phone
  - When the agent asks you to email the Repair Order to ro@autoclaims.com, confirm
    that you have sent it
  - When the agent tells you to wait for the email response, say you have received
    it and that your case number is CASE-RF-013
  - When the agent offers you the option to file the claim online using your case
    number, agree to try the online option
  knowledge: You are calling from Eastside Collision Works. A customer brought in
    a 2021 Honda Accord (VIN 1HGCV1F30MA000013, last 8 MA000013, contract VSC200013)
    with a failing power steering pump at 45,000 miles. You have not yet submitted
    the Repair Order. You initially prefer the phone but once you have your case number
    in hand you are willing to try filing online if the agent explains how. If asked
    your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Practical shop manager. Prefers phone out of habit but once they already have the case number in hand they are happy to just file online and skip the wait for an agent.
description: Repair facility insists on phone filing, goes through the full phone
  RO email process and receives case number CASE-RF-013 — agent then offers the
  option to file online using the case number and caller accepts, so agent explains
  online filing instead of escalating to a human agent
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent informs the caller that the online filing option is faster or more straightforward
    before proceeding with phone filing
- rules:
  - Agent instructs the caller to email the Repair Order to ro@autoclaims.com and
    asks them to confirm when it has been sent
- rules:
  - Agent asks the caller to inform them when the email response with the case number
    arrives
- applicability:
  - The customer did not voluntarily provide the case number unprompted
  rules:
  - Agent asks the caller for the case number from the response email
- rules:
  - After obtaining the case number, agent offers the caller the option to file the
    claim online using that case number
- rules:
  - Agent explains to the caller that they can use the case number to file the claim
    online at autoclaims.com
- rules:
  - Agent does NOT escalate to a human agent or call escalate_to_agent_from_ivr
    after the caller agrees to file online
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
id: e2e_rf_new_claim_online_after_case_number
