company_marker: assurantauto
customer:
  customer_id: CHI-019
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Tell the agent you want to cancel your contract
  - If the agent asks whether you have already contacted the selling dealer, say you have not
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I would like
    to cancel my contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Direct and decisive. Wants to cancel and asks how to proceed.
description: Customer wants to cancel their contract — agent must direct customer to return to the selling dealer first before
  escalating, not immediately transfer
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
- rules:
  - Agent tells the customer to contact or return to the selling dealer to initiate cancellation
- rules:
  - Agent asks whether the customer has already contacted the selling dealer
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - Agent does NOT immediately transfer to an agent with GAIntent CANCELLATION without first checking if customer has been
    to the selling dealer
- rules:
  - Agent does NOT escalate to a live agent when customer says they have not yet contacted the selling dealer
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
