company_marker: assurantauto
customer:
  customer_id: CHI-024
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Get help with your service contract but you do not have your paperwork or any identifiers with you
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I need help with
    my contract but I do not have my paperwork with me.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Apologetic and slightly flustered. Cooperative but unable to provide any account information.
description: Customer is unable to provide any identifier needed for the API lookup
evaluations:
- rules:
  - Agent offers the self-service portal website to the caller
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent attempts to gather an identifier for get_contract_and_claims_data_ivr
- rules:
  - Agent asks for contract number, VIN, claim number, or phone number on file
- rules:
  - Customer is unable to provide any valid identifier
- rules:
  - Agent escalates using escalate_to_agent_from_ivr function
- rules:
  - TransferReason indicates the customer cannot provide an identifier
- rules:
  - Agent explains that the Customer Service team may be able to verify identity using other methods
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
