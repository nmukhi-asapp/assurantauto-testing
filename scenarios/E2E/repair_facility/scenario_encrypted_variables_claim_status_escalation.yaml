company_marker: assurantauto
customer:
  customer_id: RF-020
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you want to check the status of an existing claim — give claim number
    37020301A when asked
  - When the agent tells you the claim is under review, say you need to speak with
    a human agent immediately — do not accept any deflection
  - When offered online chat, decline and insist on a phone agent
  knowledge: You are calling from Metro Auto Repair. You have a 2021 Toyota Tacoma
    (VIN 5TFCZ5AN0MX200030, last 8 MX200030, contract VSC200030) in your shop with
    a transmission failure. The claim number is 37020301A. The claim is currently under
    review. You want to speak with a human agent because the review has been taking
    longer than expected.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional but insistent — will not accept chat deflection and will repeat the request for a phone agent until transferred.
description: "Regression test for encrypted variable handling: PhoneNumber arrives\
  \ encrypted in input variables. Tests that decrypt_variables is called before any\
  \ API uses the phone number, that the decrypted number is used in API calls, that\
  \ encrypt_variables is called before transfer, and that the escalation function\
  \ receives encrypted PII variables."
evaluations:
- rules:
  - Agent calls decrypt_variables before calling is_repair_facility, send_sms_to_phone,
    or any claim lookup function
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using claim number 37020301A and provides the status
    to the caller
- rules:
  - The decrypted phone number (1064378068, not the encrypted value) is used as the
    PhoneNumber parameter in is_repair_facility or send_sms_to_phone
- rules:
  - Agent calls encrypt_variables before calling escalate_to_agent_from_ivr
- rules:
  - Agent calls escalate_to_agent_from_ivr with an encrypted ClaimNumber (the value
    returned by encrypt_variables, not the plain-text claim number 37020301A)
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of\
    \ the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM,\
    \ NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,\
    \ RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
id: e2e_rf_encrypted_variables_claim_status_escalation
