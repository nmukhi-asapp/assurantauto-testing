company_marker: assurantauto
customer:
  customer_id: CHI-023
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask how you can get a signed copy of your contract
  - If the agent says you can view it online, ask for a physical signed copy specifically
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'How can I get
    a signed copy of my contract?'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Methodical and detail-oriented. Wants official documentation.
description: Customer requesting a signed copy of their contract — agent must tell them they can view contract online at the
  VCP portal (vehiclecareplan.com); for a physical signed copy, direct them back to where they purchased the contract (selling
  dealer)
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
- rules:
  - Agent directs the customer to return to where they purchased their contract (the selling dealer) for a physical signed
    copy
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
