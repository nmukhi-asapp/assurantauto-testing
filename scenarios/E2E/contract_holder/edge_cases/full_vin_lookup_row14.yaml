company_marker: assurantauto
customer:
  customer_id: CHI-018
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - When asked for your VIN or phone number to look up your contract, provide your full 17-character VIN '1HGCV1F30KA100018'
  - Ask whether your contract is still active
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Your full VIN is 1HGCV1F30KA100018.
    If the agent needs to look up your contract, give the full 17-character VIN.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Helpful and cooperative. Provides whatever information the agent asks for.
description: Customer provides full 17-character VIN — agent should extract the last 8 characters (KA100018) and successfully
  retrieve the contract
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr and successfully retrieves contract data even when customer provides a full
    17-character VIN
- rules:
  - Agent confirms the customer's contract is active
- rules:
  - Agent does NOT tell the customer their VIN format is wrong or ask them to repeat just part of the VIN
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
