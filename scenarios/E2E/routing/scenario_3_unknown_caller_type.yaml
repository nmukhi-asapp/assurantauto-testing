company_marker: assurantauto
customer:
  customer_id: RT-003
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, respond vaguely (e.g., "I'm just
    calling about a car warranty")
  - If the agent asks again or gives you specific options, say "Other" or indicate you don't fit any of those categories
  - Ask to speak with a representative who can help you
  knowledge: You are calling about a car warranty issue but you are not sure which category you fall into. You are actually
    a third-party administrator calling on behalf of a fleet company, which doesn't fit neatly into Contract Holder, Dealership,
    or Employee. When asked your caller type, be vague at first, then if pushed say "Other" or "I'm not sure, I work for a
    fleet company."
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Somewhat confused about the IVR routing process. Not familiar with the specific caller categories. Will clarify when given specific options but ultimately doesn't fit a standard category.
description: Ambiguous caller type — agent should clarify then route to appropriate transfer for unknown caller types
evaluations:
- rules:
  - Agent does not route to RepairShopIssues (is_repair_facility returns false)
- rules:
  - Agent asks the caller to identify their caller type and provides clear options
- rules:
  - When caller does not fit a standard category, agent escalates to a live agent or handles the unknown caller type gracefully, OR informs the customer that agents are not currently available due to business hours
- rules:
  - Agent does not leave the caller without a next step or transfer option
