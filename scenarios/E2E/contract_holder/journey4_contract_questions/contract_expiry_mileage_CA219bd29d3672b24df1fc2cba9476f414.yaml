company_marker: assurantauto
customer:
  customer_id: CHI-022
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask whether your contract is still active and when it expires
  - If the agent asks for your current mileage, tell them your odometer reads 48500 miles
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I want to know
    if my contract is still active and when it expires.' Your current odometer is at 48500 miles.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Straightforward and cooperative. Answers questions directly.
description: Customer asking if their contract is still active — agent must ask for current vehicle mileage (odometer reading)
  before confirming contract status, since the contract could expire by mileage before the date expiration
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
- rules:
  - Agent asks the customer for their current vehicle mileage (odometer reading) before confirming the contract is active
- rules:
  - Agent does NOT confirm the contract is active without first asking for the customer's current mileage
- rules:
  - Agent uses both the expiration date and expiration mileage from the contract to determine and communicate the contract
    status
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
