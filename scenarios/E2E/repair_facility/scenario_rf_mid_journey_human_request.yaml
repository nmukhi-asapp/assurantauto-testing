company_marker: assurantauto
customer:
  customer_id: RF-022
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Ask to check authorization status on an existing claim
  - If offered a portal link via text, decline and ask to look up the claim over the phone
  - Provide your claim number 37020222A when asked for an identifier
  - When the agent reads back the claim number and asks you to confirm, say yes
  - When the agent provides the authorization status, say thank you — then immediately ask to speak to a live agent without explaining why
  - When the agent asks what you need help with, say the authorization amount approved was $200 short of your repair estimate and you want to dispute it with a specialist
  - If the agent tries to resolve the dispute through the IVR, insist you need a person to review the decision
  knowledge: You are calling from Pacific Coast Auto Repair. You have claim 37020222A for a 2022 Honda CR-V (VIN 2HKRW2H55NH200022,
    last 8 NH200222, contract VSC200022). The claim was authorized for $850 but your repair estimate was $1,050. You want to
    dispute the shortfall with a claims specialist. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Experienced shop manager who got the claim status first but noticed the payout is short. After getting the status, drops the human request casually without explanation — only reveals the reason when directly asked.
description: "Repair facility completes an authorization status check and then, without\
  \ explanation, requests a live agent. Agent should ask what the caller needs before\
  \ escalating, recognize the authorization dispute is outside IVR scope, and escalate\
  \ via escalate_to_agent_from_ivr. Tests that the agent probes mid-conversation human\
  \ requests rather than immediately acceding."
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using the claim number or other identifier provided
- rules:
  - Agent provides the authorization status of the claim to the caller
- rules:
  - When the caller requests a live agent, the agent asks what they need help with before escalating
- rules:
  - Caller states they want to dispute the authorization amount or payout
- rules:
  - Agent recognizes the authorization dispute cannot be resolved through the IVR and escalates using escalate_to_agent_from_ivr, OR informs the customer that agents are not currently available due to business hours
- rules:
  - Agent informs the caller they will be connected to the appropriate team, OR informs the customer that agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM,
    NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
