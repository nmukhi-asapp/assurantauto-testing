id: e2e_dealer_coverage_question_engine_mounts
company_marker: assurantauto
description: Dealer calls with a pre-claim coverage question about engine mounts for
  a customer's vehicle. Agent should look up the contract via get_contract_and_claims_data_ivr,
  read the termsStructuredText, and describe what the contract says about engine mount
  coverage without confirming or denying that the specific repair is covered.
tags:
- e2e
- dealership
- coverage_question
- contract_lookup
- termsStructuredText
customer:
  customer_id: DLR-coverage-001
  evaluation_goals:
  - evaluation_goal: The agent looks up the contract using the identifier provided
      and uses the termsStructuredText to respond to the coverage question.
    is_possible: true
  - evaluation_goal: The agent describes what the contract terms say about engine
      mounts without confirming or denying that the repair is covered.
    is_possible: true
  - evaluation_goal: The agent does not immediately escalate to a live agent without
      first attempting to answer the coverage question from the contract data.
    is_possible: true
  goals:
  - When the agent asks your caller type, say you are a dealership
  - When the agent asks what you need help with, say you have a coverage question
    for a customer's vehicle
  - When the agent asks for an identifier, provide the contract number VSC210055
  - When the agent asks what specifically you want to know, say you want to know if
    engine mounts are covered under the contract
  - If the agent tells you what the contract terms say about engine mounts, confirm
    you understand and say that is all you needed
  knowledge: You are calling from Riverside Auto Group. A customer has brought in a
    2021 Toyota Camry (contract number VSC210055) and you need to know if engine mounts
    are covered before submitting a repair authorization. You are not ready to file
    a claim yet — this is a pre-claim coverage check.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words. Never volunteers context unless asked. Professional
    dealership service manager.
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a dealership
- rules:
  - Agent asks for a vehicle identifier before looking up the contract
- rules:
  - Agent calls get_contract_and_claims_data_ivr to retrieve the contract data
- rules:
  - Agent uses the termsStructuredText to respond to the engine mount coverage question
    rather than escalating immediately
- rules:
  - Agent describes what the contract terms say about engine coverage without explicitly
    confirming or denying that engine mounts are definitively covered
