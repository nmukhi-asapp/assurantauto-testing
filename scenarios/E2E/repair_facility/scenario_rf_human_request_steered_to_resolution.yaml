company_marker: assurantauto
customer:
  customer_id: RF-021
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Start by saying you need to speak to a live agent
  - When the agent asks what you need help with, say you need to check if a claim
    has been authorized so you can order parts
  - Provide your claim number 37020021 when asked for an identifier
  - When the agent reads back the claim number and asks you to confirm, say yes
  - Accept the authorization status when the agent provides it
  knowledge: You are calling from Westside Auto Works. You have a customer vehicle
    (2021 Toyota RAV4, VIN 2T3BFREV5MW200021, last 8 MW200021, contract VSC200021)
    with claim 37020021 for a power steering failure. You want to confirm the claim
    is authorized before ordering parts. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Busy shop manager. Initially asks for a human
    out of habit, but is practical — once the agent shows it can check authorization
    directly, cooperates and accepts the answer.
description: Repair facility opens with a human agent request, but their actual need
  — checking claim authorization status — is fully within the IVR's scope. Agent should
  ask what the caller needs, recognize the request is handleable, look up the claim
  using the provided claim number, and provide the authorization status without escalating.
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent asks what the caller needs help with before deciding whether to escalate
- rules:
  - Agent recognizes the claim status inquiry is within its scope and does NOT escalate
- rules:
  - Agent asks for a claim identifier and looks up the claim using getClaimsClaimNumber
- rules:
  - Agent provides the authorization status and informs the caller the authorization
    letter was sent
- rules:
  - Agent does NOT transfer to a human agent
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM,
    NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
