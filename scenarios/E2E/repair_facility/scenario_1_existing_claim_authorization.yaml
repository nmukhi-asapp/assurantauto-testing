company_marker: assurantauto
customer:
  customer_id: RF-001
  evaluation_goals: null
  goals:
  - Check the authorization status of an existing claim for a 2019 Honda Accord (contract number VSC200001)
  - If offered a portal link via text message, decline and ask to look up the claim over the phone instead
  knowledge: You are calling from Johnson Auto Repair, a licensed independent repair facility. You have a customer vehicle
    (2019 Honda Accord, VIN 1HGCV1F30KA200001) with an approved service contract. The customer brought the vehicle in for
    AC compressor failure. You submitted a repair order and received claim number 37020201A. The contract number is VSC200001.
    The last 8 characters of the VIN are KA200001. You want to confirm the claim is authorized so you can proceed with the
    repair.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and efficient. Provides information concisely. Familiar with the claims process. Wants to confirm authorization before ordering parts.
description: Repair facility calling to check authorization status on an existing claim for AC compressor repair
evaluations:
- rules:
  - Agent offers the self-service portal website to the caller
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using contract number, VIN last 8, or claim number
- rules:
  - Agent provides the authorization status of the claim
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
