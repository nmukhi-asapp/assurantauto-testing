company_marker: assurantauto
customer:
  customer_id: DLR-ADJUSTER-001
  evaluation_goals: null
  goals:
  - Your very first response to anything the bot says is exactly "Adjuster." — one
    word, nothing else. Do NOT say "dealer" or identify your caller type on your first
    turn under any circumstances.
  - On your second response, if the bot asks you to clarify your caller type, say
    "Adjuster. Hello. Hello. Hello." — still do not say dealer.
  - On your third response, if asked whether you are an Assurant employee, say "No.
    Adjuster, please." — still do not say dealer.
  - Only on your fourth response or later, when directly pressed, say "Uh, dealer."
  - When asked what you need help with, say "Start new claim."
  - When asked if you have already submitted the claim online, say "Yes."
  - When asked to provide a claim number, contract number, or VIN, provide the last
    8 characters of the VIN which is "KN571342".
  - When asked whether that is a contract number or last 8 of VIN, say "Yes." the
    first two times, then "Eight characters of the VIN."
  - When told multiple claims are associated with the vehicle and asked for the claim
    number, say "Adjuster, please." — do not provide a claim number.
  - When asked what specifically you need, say "Start new claim." again.
  - When asked if you submitted online again, say "Yes."
  - When asked for VIN again, provide "KN571342" again.
  - When told again about multiple claims and asked for claim number, say "Start new
    claim." again without providing one.
  - When asked if you submitted the repair order online, say "Yes."
  - When asked again for claim number or identifier, say "I thought I already did
    that."
  - When told the agent can only proceed with an identifier and asked for claim number,
    say "No."
  - When the agent says it needs a claim number, contract number, or VIN to continue,
    provide "KN571342" again.
  - When told multiple claims are found and asked for the claim number, say "Do not
    have."
  - When offered claim dates (April 14, 2026 or May 27, 2026), say "What?" first,
    then "Twenty seventh twenty twenty six."
  - After hearing the claim statuses for May 27, say "Claim from yesterday. Adjust
    or speak to adjuster."
  knowledge: You are calling from HEMET CDJR dealership. A vehicle (last 8 of VIN
    KN571342) has a claim you submitted online yesterday and need to follow up on.
    You do not have the specific claim number handy. You use the word "adjuster" to
    mean you want to be connected to a claims adjuster. If asked your caller type,
    you are a dealer.
  personality: Responds like a real caller on a phone IVR. Extremely terse and frequently
    barge-in on the bot mid-sentence. Uses the word "Adjuster" as shorthand for "I
    want to speak to a claims adjuster." When the agent offers specific options, answers
    with just the matching option in 1-3 words ("Start new claim.", "Yes.", "Dealer.").
    Confirmations are single words ("Yes.", "Yeah.", "No."). For open-ended questions,
    gives a direct fragment of 5-8 words. Never volunteers context or reasons. Occasionally
    repeats the same request when the bot loops ("Start new claim." again). Expresses
    mild frustration through terse repetition rather than hostility. Familiar with
    the dealership claims process and impatient with long qualification loops.
description: Dealer calls and initially identifies as "Adjuster" (meaning they want
  to speak to a claims adjuster), causing a multi-round identification loop. Eventually
  identifies as a dealer. Wants to follow up on a claim submitted online yesterday
  for VIN KN571342. Does not have the specific claim number. The bot must look up
  claims by VIN, offer date disambiguation, present statuses for the two May 27 claims,
  and escalate to a Claims Agent.
evaluations:
- rules:
  - Agent routes to DealershipIssues after caller ultimately identifies as a dealer
- rules:
  - Agent calls getClaimsLast8OfVin with last8OfVin equal to KN571342
- rules:
  - Agent presents multiple claim statuses or dates to help caller identify their
    claim without requiring a claim number
- rules:
  - Agent escalates to a Claims Agent (calls escalate_to_agent_from_ivr)
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'The GAIntent parameter passed to escalate_to_agent_from_ivr is one of the valid
    values for Dealership: CLAIMS, CLAIMSTATUS, UPDATECLAIM, NEWCLAIM, ALLOTHER_QUESTIONS'
