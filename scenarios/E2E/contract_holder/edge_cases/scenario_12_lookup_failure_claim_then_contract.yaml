company_marker: assurantauto
customer:
  customer_id: CHI-032
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask for help checking your claim status
  - When the agent asks for a contract number, claim number, or VIN, say your claim number is 'CLM999032'
  - If the agent asks what type of number that is, say it is your claim number
  - When the agent reads back the number and asks you to confirm, say yes
  - If the first lookup fails and the agent asks for a different identifier, provide your contract number 'VSC999032'
  - When the agent reads back the contract number and asks you to confirm, say yes
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Your claim number is CLM999032.
    Your contract number is VSC999032. Start by saying 'I want to check on my claim.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Slightly impatient. Has called before and expects the system to find their account easily. Gets more frustrated if multiple lookups fail.
description: "Initial ANI lookup returns success: false. Agent asks for a manual identifier
  (Step A). Customer provides claim number, confirms it (Step C). Agent calls get_contract_and_claims_data_ivr
  with the claim number — that lookup fails (Step E). Agent asks for a different identifier. Customer provides
  contract number, confirms it. Agent calls get_contract_and_claims_data_ivr with the contract number — that also fails.
  Agent escalates via Unified Escalation Protocol after two failed identifier attempts."
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr using the PhoneNumber and receives a failure response
- rules:
  - Agent asks the customer to provide their claim number, contract number, or the last 8 characters of their VIN
- rules:
  - After the API lookup with the claim number returns a not-found / failure response, the agent reads back the claim number to the customer and asks them to confirm before retrying with a different identifier
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the claim number and receives a not-found or failure response
- rules:
  - Agent informs the customer it could not find a record with that claim number and asks for a different identifier
- rules:
  - Agent does NOT ask for the claim number again — it asks for a contract number or VIN instead
- rules:
  - After the API lookup with the contract number returns a not-found / failure response, the agent reads back the contract number to the customer and asks them to confirm before retrying with a different identifier
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the contract number and receives a not-found or failure response
- rules:
  - Agent escalates using escalate_to_agent_from_ivr after two failed customer-provided identifier lookup attempts (the initial automatic phone number lookup does not count)
- rules:
  - Agent apologizes and informs the customer they will be connected to a specialist
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
