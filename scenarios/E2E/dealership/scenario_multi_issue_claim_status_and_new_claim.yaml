company_marker: assurantauto
customer:
  customer_id: DLR-MI-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - When offered the portal, say you prefer to handle it over the phone
  - Ask about the status of an existing claim — provide claim number 37030101A when asked
  - When the agent tells you the status is Payment Authorized, ask what that means exactly and when you can expect to receive
    the payment
  - After the agent answers, say you also have a new vehicle coming in for a customer with contract VSC300102 and want to
    know how to start a new claim
  knowledge: You are calling from Riverside Auto Group. You have an existing claim (37030101A, contract VSC300101) for a transmission
    replacement on a 2020 Ford Explorer (VIN 1FM5K7D8LGB300101, last 8 GB300101). The claim was authorized and repairs are
    complete — you submitted the final invoice and want to know the payment status. You also have a second customer with contract
    VSC300102 bringing their vehicle in and want to know how to start a new claim. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Businesslike dealership finance manager. Asks clear follow-up questions when the agent uses status language. Expects to handle multiple issues in a single call rather than being transferred or calling back.
description: Dealership calls about payment status on an existing claim, asks what the status means and when payment arrives,
  then raises a second issue (starting a new claim) — tests multi-issue handling and status explanation without escalation
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent looks up claim 37030101A using an available claim lookup function
- rules:
  - Agent communicates the claim status (Payment Authorized) to the caller
- rules:
  - Agent explains what Payment Authorized means using the longVerbiageStatus or equivalent explanation, without escalating
    to a human agent solely for this question
- rules:
  - Agent addresses the caller's second issue (starting a new claim) without requiring a new call or immediately escalating
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent solely because the caller asked what the payment
    status means
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The caller provided the vehicle VIN for the new claim to the agent before being transferred to a claims adjuster
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL,
    CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
id: e2e_dealership_multi_issue_claim_status_and_new_claim
