company_marker: assurantauto
customer:
  customer_id: RF-RV-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are calling about an existing claim, filing a
    new claim, or a coverage question, say existing claim
  - When asked about the issue sub-type, say you need to modify the claim
  - When asked for an identifier, provide the contract number 'ARV1A111B8H'
  - If the agent asks whether the vehicle is a recreational vehicle or RV, say yes,
    it is a motorhome
  - Accept being transferred to an agent
  knowledge: You are calling from West Wind Mobile RV Service, an independent repair
    facility. You are working on a 2026 Jayco North Point motorhome under contract
    ARV1A111B8H (VIN 1UJCJ0BVXN1LF0249). Claim 50612278 was authorized, but you need
    to add an additional part to the claim before finishing the repair. If asked,
    confirm the vehicle is a recreational vehicle / RV.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Repair facility.", "Existing claim.", "Modifying claim."). Confirmations are
    single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended
    questions, gives a direct fragment of 5-8 words — never full sentences, never
    explanations. Never volunteers context or reasons unless asked directly. Professional
    and slightly impatient.
description: "Regression test reproducing production conversation 2771077585-2421101041-2426455800-2715840925,\
  \ where the claim lookup returned unambiguous RV signal (make=JAYCO, specCoveragePlanCode='Exclusionary\
  \ RV', repairShopName='WEST WIND MOBILE RV SERVICE') but the agent never ran the\
  \ RV Confirmation Check before escalating, resulting in GAIntent=UPDATECLAIM (routing\
  \ to CLAIM) instead of GAIntent=RV (routing to RV). The escalation brick now has\
  \ a mandatory STOP-gate requiring the agent to explicitly evaluate make/model/specCoveragePlanCode\
  \ before calling get_hoop_message. This scenario verifies the agent asks the RV\
  \ confirmation question and overrides the intent to RV."
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using the contract number provided
- rules:
  - Before escalating, the agent asks the caller whether the vehicle is a recreational
    vehicle or RV
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'RV' rather than 'UPDATECLAIM', since the caller confirmed
    the vehicle is a recreational vehicle
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
