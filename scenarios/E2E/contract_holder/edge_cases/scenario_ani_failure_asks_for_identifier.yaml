company_marker: assurantauto
customer:
  customer_id: CHI-REGRESSION-ANI-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a customer, dealer, repair facility, or Assurant
    employee, say you are a customer calling about your contract
  - Do not volunteer the reason you are calling — wait for the agent to ask
  - When the agent asks for a phone number tied to your contract, say you don't remember the phone number on your account
  - When the agent asks for a claim number, contract number, or VIN, provide your
    contract number 'VSC887701'
  - If the agent asks what type of number it is, say it is your contract number
  knowledge: You are a contract holder. Your contract number is VSC887701. Start by
    saying 'I have a question about my contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When
    the agent offers specific options, answers with just the matching option in 1-3
    words ("Customer.", "Contract holder."). Confirmations are single words or short
    phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives
    a direct fragment of 5-8 words — never full sentences, never explanations. Never
    volunteers context or reasons.
description: "Regression test for the ANI-failure → Step 1A skip bug. The initial\
  \ phone number lookup returns no contract found. After the customer identifies as\
  \ a Contract Holder without stating a specific request, the agent must ask for an\
  \ identifier (Step 1A of ContractHolderIssues) rather than jumping straight to wrap-up.\
  \ Reproduces production conversation 3796611462-1127682545-2758644792-0825805307\
  \ where the agent said 'Is there anything else you need help with today?' immediately\
  \ after caller identification, without ever asking for a contract/claim/VIN."
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as
    a Contract Holder
- rules:
  - After the customer identifies as a Contract Holder, agent asks for the phone number tied to their contract, then asks for a claim number,
    contract number, or the last 8 characters of their VIN before asking 'Is there
    anything else I can help you with?' or ending the call
- rules:
  - Agent does NOT call end_of_conversation before asking the customer for an identifier
- rules:
  - Agent asks the customer for an identifier (claim number, contract number, or VIN)
    as its first substantive action in ContractHolderIssues
- rules:
  - Agent calls get_contract_and_claims_data_ivr using the contract number provided by the customer
