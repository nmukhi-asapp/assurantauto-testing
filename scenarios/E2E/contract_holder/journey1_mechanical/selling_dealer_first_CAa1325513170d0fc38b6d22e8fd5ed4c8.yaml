company_marker: assurantauto
customer:
  customer_id: CHI-021
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Tell the agent your car has a mechanical issue and you need to get it repaired
  - Ask where you should take your car for repairs
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I have a mechanical
    issue with my car. I'm not sure where I should take it for repairs.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Cooperative and open to suggestions. Wants clear guidance on how to proceed.
description: Customer asking where to take car for repair — agent must recommend returning to the selling dealer first before
  suggesting a repair facility; must not say 'vehicle service contract'
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
- rules:
  - Agent recommends the selling dealer as the first option for repairs before mentioning independent repair facilities
- rules:
  - Agent does NOT say 'vehicle service contract' — must refer to it simply as 'contract' or 'coverage'
- rules:
  - Agent provides the selling dealer name or contact information from the contract data
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
