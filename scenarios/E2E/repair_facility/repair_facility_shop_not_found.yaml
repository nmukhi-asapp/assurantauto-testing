company_marker: assurantauto
customer:
  customer_id: RF-SHOP-NOT-FOUND-001
  evaluation_goals: null
  goals:
  - When asked to identify yourself, say you are a repair facility.
  - When asked what you need help with, explain that you sent in a claim but Assurant
    could not find your shop in their system, and you are calling to provide your
    shop name so the claim can be processed.
  - If the agent cannot resolve this directly and offers to transfer you to a live
    agent, accept.
  - If transferred to a live agent, your goal is complete.
  knowledge: You are a repair facility. You submitted a claim to Assurant but it
    could not be processed because Assurant's system could not find your shop. You
    are calling to provide your shop name so it can be registered and the claim can
    proceed. You do not have a contract number, VIN, or claim number to provide —
    the issue is that your shop is not in Assurant's system.
  personality: Speaks in short, direct sentences. Cooperative and provides information
    when asked. Does not volunteer extra details unless prompted.
description: Repair facility calls because a submitted claim could not be processed
  — Assurant's system could not find their shop. Caller wants to provide their shop
  name to unblock the claim. Bot should escalate to a Claims Agent rather than apologizing
  and ending the call without resolution.
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent escalates to a live agent (calls escalate_to_agent_from_ivr) rather than
    ending the call without offering escalation
- rules:
  - Agent does NOT end the conversation without first offering to transfer the caller
    to a human agent
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
