company_marker: assurantauto
customer:
  customer_id: CHI-MULTIJOURNEY-001
  evaluation_goals: null
  goals:
  - You are a contract holder — identify yourself as such if asked
  - Tell the agent you have a few questions about your 2021 Hyundai Sonata
  - First ask what your deductible is
  - After the agent answers the deductible question, ask whether you can get a rental
    car while your vehicle is being repaired
  - Also ask about what roadside assistance covers
  knowledge: You are a contract holder. Your 2021 Hyundai Sonata is currently in
    the shop for a covered repair. You have an active authorized claim. You want to
    know (1) what your deductible is, (2) whether you can get a rental car since your
    car is in the shop, and (3) what roadside assistance covers. You do NOT want to
    be transferred to a human agent — you want to get answers on this call.
  personality: Responds like a real caller on a phone IVR. Moderately terse but asks
    follow-up questions. Answers options with 1-3 words. Confirmations are short ("Yes.",
    "Yeah.", "That's correct."). For open-ended questions gives a direct answer in
    5-10 words. Practical car owner who wants quick answers. Mildly frustrated if
    transferred unnecessarily for a straightforward rental question.
description: Contract holder with an active authorized claim and rentalIndicator=Y
  asks about deductible, rental coverage, and roadside assistance in a single call.
  Agent should handle all three inline without escalating for rental. Reproduces production
  issue from conv 0750593503 where the blanket "Customer has questions about rental
  car benefits" escalation rule in Escalation Scenarios overrode Journey 3's in-flight
  rental handling.
evaluations:
- rules:
  - Agent routes to ContractHolderIssues after the caller identifies as a contract
    holder
- rules:
  - Agent answers the deductible question using data from get_contract_and_claims_data_ivr
    without escalating
- rules:
  - Agent does NOT escalate to a live agent solely because the customer asked about
    rental car benefits when an authorized claim exists and rentalIndicator is Y
- rules:
  - Agent handles the rental inquiry inline using Journey 3 — presents booking options
    (Enterprise booking vs. self-booking for reimbursement) since the claim is authorized
- rules:
  - Agent handles the roadside coverage question using termsStructuredText from contract
    data
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS,
    NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
id: e2e_ch_rental_roadside_inline
