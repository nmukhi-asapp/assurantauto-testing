company_marker: assurantauto
customer:
  customer_id: CHI-030
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask for help with your service contract
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder.
    Start by saying 'I need help with my service contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Patient. Expects professional service recovery if there are technical issues.
description: "get_contract_and_claims_data_ivr returns a nested escalation response due
  to contractClaims network timeout — reproduces JinjaRenderError in ContractHolderIssues
  template (bug: template accesses response.contractClaims without checking for escalation)"
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after the caller identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr
- rules:
  - Agent escalates using escalate_to_agent_from_ivr after receiving the error response
    from get_contract_and_claims_data_ivr
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
id: e2e_edge_case_contractclaims_timeout
