company_marker: assurantauto
customer:
  customer_id: CHI-035
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Start by saying you need to speak to a human agent
  - When the agent asks what you need help with, say you cannot log into the VCP portal to view your contract
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. You are unable to log into the
    Vehicle Care Plan portal. Start by saying 'I need to speak with a human agent please.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Polite but firm. Does not want to be deflected. States portal login issue only when asked why they want a human.
description: Contract holder opens with 'I need a human agent' without stating a reason. Agent should ask what they need help
  with (not blindly escalate). Customer then explains they cannot log into the VCP portal. Portal login issues are explicitly
  listed as an escalation trigger in ContractHolderIssues. Agent must recognize this is outside its scope and escalate via
  Unified Escalation Protocol, rather than attempting to troubleshoot login directly.
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr and successfully retrieves the customer's contract
- rules:
  - Agent asks the customer what they need help with before escalating, rather than blindly escalating on the request alone
- rules:
  - Customer states they cannot log into the VCP portal
- rules:
  - Agent does NOT attempt to troubleshoot the portal login directly
- rules:
  - Agent escalates using escalate_to_agent_from_ivr, OR informs the customer that agents are not currently available due
    to business hours
- rules:
  - Agent informs the customer they will be connected to the appropriate team, OR informs the customer that agents are not
    currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
