company_marker: assurantauto
customer:
  customer_id: EMP-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are an Assurant Employee
  - Explain that you are calling to ask about a customer claim you are handling internally
  knowledge: You are an Assurant employee calling from an internal line. You are handling
    an escalated customer case and need to speak with a live agent. When the agent
    asks what type of caller you are, say you are an Assurant Employee.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Professional internal employee. Gives brief,
    direct answers. Cooperative with the system's prompts and expects to be transferred
    promptly.
description: Assurant employee calls in — EmployeeIssues should immediately escalate
  to a human agent via escalate_to_agent_from_ivr
evaluations:
- rules:
  - Agent routes to EmployeeIssues after the caller identifies as an Assurant Employee
- rules:
  - Agent escalates using escalate_to_agent_from_ivr without asking additional questions,
    OR informs the customer that agents are not currently available due to business
    hours
