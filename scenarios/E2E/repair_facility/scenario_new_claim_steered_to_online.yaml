company_marker: assurantauto
customer:
  customer_id: RF-011
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you need to start a new claim and have not yet submitted the Repair Order
  - When the agent mentions the online option, say you would prefer to handle it over
    the phone
  - When the agent explains the online option is faster or straightforward, agree to
    use the online option
  knowledge: You are calling from Blue Ridge Auto Center. A customer brought in a 2019
    Subaru Outback (VIN 4S4BSANC0K3200011, last 8 K3200011, contract VSC200011) with
    an engine oil leak at 58,000 miles. You have not yet submitted the Repair Order.
    You initially prefer the phone but are open to using online once it is explained
    clearly. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Pragmatic shop manager. Defaults to phone because that is what they know, but willing to switch to online once they understand it is easier and faster.
description: Repair facility initially prefers phone filing but agrees to use online
  after agent explains it is faster and straightforward — agent directs them to email
  RO and explains the case number process
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent explains the online filing option is faster or more straightforward when
    the caller expresses a preference for phone
- rules:
  - Agent directs the caller to email the Repair Order to ro@autoclaims.com after
    they agree to proceed online
- rules:
  - Agent explains the caller will receive a case number by email to complete the
    online filing
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
