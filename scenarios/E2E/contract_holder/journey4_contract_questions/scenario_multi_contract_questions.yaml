company_marker: assurantauto
customer:
  customer_id: CH-MI-002
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask what your deductible is
  - After the agent answers, ask what your responsibilities are under the contract (what you need to do to keep your coverage
    valid)
  - After the agent answers, ask whether routine oil changes are covered under your contract
  knowledge: You are calling about your 2021 Hyundai Sonata (contract VSC100092). You have several questions about your contract
    details. You want to know your deductible, what your responsibilities are, and whether oil changes are covered. If asked
    your caller type, say Contract Holder.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Thorough and methodical. Asks one question at a time but has multiple questions prepared. Expects the agent to answer each question using the contract information rather than transferring to a human for basic contract questions.
description: Contract holder asks three sequential questions about their contract — deductible amount, customer responsibilities,
  and oil change coverage — all answerable from contract data
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr to retrieve contract data before answering
- rules:
  - Agent answers the deductible question using data from the retrieved contract (deductible is $100 in-network, $200 out-of-network)
- rules:
  - Agent answers the customer responsibilities question using the contract terms, without escalating
- rules:
  - Agent answers the oil change coverage question by stating that routine maintenance (including oil changes) is not covered,
    using the exclusions in the contract terms
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent to answer any of these three contract questions
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
