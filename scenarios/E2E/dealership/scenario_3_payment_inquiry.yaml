company_marker: assurantauto
customer:
  customer_id: DLR-003
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - When offered the portal, say you prefer to handle it over the phone
  - Ask when you will receive payment for an authorized claim — repairs are complete and you want to know when the check will
    arrive
  - If the agent cannot give a specific date, accept being transferred
  knowledge: You are calling from Metro Ford. A claim (37030003A, contract VSC300003) for brake and rotor replacement on a
    2020 Toyota Camry (VIN 2T1BURHE8JC300003, last 8 JC300003) was authorized and repairs are complete. You submitted the
    final invoice and want to know when you will receive payment. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Businesslike. Wants a specific timeline for payment. Will ask follow-up questions if the answer is vague and accept escalation.
description: Dealership inquiring about payment timeline for an authorized claim — escalates to payment specialist
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent asks for a claim identifier and looks up the claim using an available claim lookup function
- rules:
  - Agent identifies the claim status as Payment Authorized or similar and communicates it to the caller
- rules:
  - Agent escalates using escalate_to_agent_from_ivr for specific payment timeline information, OR informs the customer that
    agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'CLAIMS' or 'CLAIMSTATUS'
- rules:
  - ClaimStatus is set to 'Authorized'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL,
    CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'CLAIMSTATUS'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
