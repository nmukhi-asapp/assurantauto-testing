company_marker: assurantauto
customer:
  customer_id: CH-MI-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Start by asking a general question about what your service contract covers
  - After the agent gives a general overview of your contract, ask specifically whether you are covered for a rental car while
    your vehicle is being repaired
  - If the agent says you are covered, ask how much you get per day and for how long
  knowledge: You are calling about your 2021 Hyundai Sonata (contract VSC100091). You want to know what your service contract
    covers, and then specifically whether you get a rental car during repairs and what the daily limit is. If asked your caller
    type, say Contract Holder.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Curious and engaged. Wants specific details about rental coverage after getting a general overview. Will ask follow-up questions rather than accepting vague answers.
description: Contract holder asks general coverage question then follows up with specific rental car coverage question including
  daily rate and duration limits
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr to retrieve contract data before answering
- rules:
  - Agent provides a general overview of contract coverage using the retrieved contract data
- rules:
  - Agent answers the rental car follow-up question without escalating to a human agent
- rules:
  - Agent provides the specific rental reimbursement amount ($35 per day) from the contract terms
- rules:
  - Agent provides the maximum rental duration (10 days) from the contract terms
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent to answer the rental coverage follow-up question
- applicability:
  - The agent escalated the call or transferred to a human agent
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent speaks out a phone number to the customer
  rules:
  - 'The phone number is spoken digit by digit in groups of 3, 3, and 4, with digits within
    each group separated by commas and each group followed by a period. The complete number
    is then repeated once more for confirmation. For example, for 1-800-752-6265: 8, 0, 0.
    7, 5, 2. 6, 2, 6, 5. 8, 0, 0. 7, 5, 2. 6, 2, 6, 5.'
