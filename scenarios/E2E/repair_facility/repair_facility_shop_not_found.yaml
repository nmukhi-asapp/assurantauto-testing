company_marker: assurantauto
description: Repair facility calls because a submitted claim could not be processed —
  Assurant's system could not find their shop. Caller wants to provide their shop
  name to unblock the claim. Bot should escalate to a Claims Agent since registering
  or updating shop information is out of scope for self-service.
tags:
- RepairShopIssues
- escalation
customer:
  customer_id: b95b8f2b-dc80-5228-8d4a-227216b38130
  goals:
  - You are a repair facility calling Assurant. When asked to identify yourself, say
    you are a repair facility.
  - You submitted a claim but Assurant could not find your shop in their system, which
    prevented the claim from being processed. You are calling to provide your shop
    name so it can be added and the claim can proceed.
  - If the agent asks what you need help with, explain that you sent in a claim but
    Assurant could not find your shop, and you want to give them your shop name.
  - If the agent cannot resolve this directly, you want to be transferred to a live
    agent who can update your shop information.
  - If you are transferred to a live agent, your goal is complete.
  knowledge: You are a repair facility. You submitted a claim to Assurant but it could
    not be processed because Assurant's system could not find your shop. You are calling
    to provide your shop name so it can be registered and the claim can be processed.
    You do not have a contract number, VIN, or claim number to provide — the issue
    is that your shop is not in Assurant's system.
  personality: Speaks in short, direct sentences. Cooperative and provides information
    when asked. Does not volunteer extra details unless prompted.
  evaluation_goals:
  - evaluation_goal: The bot transfers the caller to a live Claims Agent rather than
      ending the call without resolution.
    is_possible: true
  - evaluation_goal: The bot does not apologize and end the call without first offering
      escalation to a live agent.
    is_possible: true
