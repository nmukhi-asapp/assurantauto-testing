company_marker: assurantauto
customer:
  customer_id: RF-010
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you need to start a new claim and have not yet submitted the Repair Order
  - When the agent mentions the online option, say you prefer to handle it over the phone
  - When the agent explains online is faster or easier, insist you want to do it over
    the phone
  - When the agent asks you to email the Repair Order to ro@autoclaims.com, confirm
    that you have sent it
  - When the agent tells you to wait for the email response, say you have received
    it and the case number is 49310010
  knowledge: You are calling from Valley Tire and Auto. A customer brought in a 2020
    Ford F-150 (VIN 1FTFW1E56LFA00010, last 8 LFA00010, contract VSC200010) with a
    transmission issue at 72,000 miles. You have not yet submitted the Repair Order.
    You prefer to handle everything over the phone. During the call you will email
    the RO and receive case number 49310010. If asked your caller type, say repair
    facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Old-school shop owner. Prefers phone over computers and is stubborn about it. Cooperative and straightforward once committed to the phone process.
description: Repair facility insists on phone filing — agent steers toward online but
  proceeds with multi-step phone process when caller insists, obtaining case number
  49310010 and escalating
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent informs the caller that the online filing option is faster or more straightforward
    before proceeding with phone filing
- rules:
  - Agent instructs the caller to email the Repair Order to ro@autoclaims.com and
    asks them to confirm when it has been sent
- rules:
  - Agent asks the caller to inform them when the email response with the case number
    arrives
- applicability:
  - The customer did not voluntarily provide the case number unprompted
  rules:
  - Agent asks the caller for the case number from the response email
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent before
    first obtaining the case number from the caller
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
