company_marker: assurantauto
customer:
  customer_id: CH-031
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask to check the status of your claim
  - Provide your contract number VSC100031 when asked for an identifier
  - When the agent reads back the contract number or confirms the lookup, say yes
  - When the agent provides the claim status, acknowledge it — then immediately ask to speak to a live agent without explaining why
  - When the agent asks what you need help with, say you want to know if you're covered for a rental car while your vehicle is at the shop
  - Accept the agent's answer about rental coverage without insisting on a human transfer
  knowledge: You are calling about your 2021 Chevrolet Equinox (contract VSC100031, VIN 1GNAXUEV5MZ100031, last 8 MZ100031).
    You have an open claim for a transmission failure that was just authorized. Your car is currently at the repair shop and
    you want to know if you get a rental car reimbursement and what the daily limit is. If asked your caller type, say Contract
    Holder.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Relieved the claim was approved, then remembers the rental question mid-call. Asks for a human out of habit — does not realize the IVR can answer rental coverage questions. Once the agent provides the rental info clearly, accepts it without pushing for a transfer.
description: "Contract holder checks claim status, gets the answer, then mid-conversation\
  \ asks for a live agent without saying why. Agent should ask what the caller needs,\
  \ recognize the rental car coverage question is fully within IVR scope, and answer\
  \ it from the retrieved contract data without escalating. Tests that the agent probes\
  \ mid-conversation human requests and steers in-scope follow-ups to resolution."
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr and retrieves claim and contract data
- rules:
  - Agent provides the claim status to the caller
- rules:
  - When the caller requests a live agent, the agent asks what they need help with before deciding whether to escalate
- rules:
  - Caller states they want to know about rental car coverage while their vehicle is being repaired
- rules:
  - Agent recognizes the rental coverage question is within its scope and does NOT escalate
- rules:
  - Agent answers the rental car coverage question using the retrieved contract data, including the daily reimbursement amount and maximum duration
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent to answer the rental coverage question
- applicability:
  - The agent called escalate_to_agent_from_ivr or escalate_to_live_agent
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS,
    NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent speaks out a phone number to the customer
  rules:
  - 'The phone number is spoken digit by digit in groups of 3, 3, and 4, with digits within
    each group separated by commas and each group followed by a period. The complete number
    is then repeated once more for confirmation. For example, for 1-800-752-6265: 8, 0, 0.
    7, 5, 2. 6, 2, 6, 5. 8, 0, 0. 7, 5, 2. 6, 2, 6, 5.'
