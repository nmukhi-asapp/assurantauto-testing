company_marker: assurantauto
customer:
  customer_id: CHI-020
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Get help with your service contract even though the system is having technical issues
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I need help with
    my service contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Patient initially but becomes frustrated if not helped. Expects professional service recovery.
description: API call to get_contract_and_claims_data_ivr returns an error response
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent attempts to call get_contract_and_claims_data_ivr before answering the customer's substantive questions
- rules:
  - Agent receives an error or failure response from the API
- rules:
  - Agent acknowledges the technical issue professionally
- rules:
  - Agent escalates using escalate_to_agent_from_ivr function
- rules:
  - TransferReason indicates a system or API error
- rules:
  - Agent apologizes for the inconvenience and ensures the customer will be helped by a specialist
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
