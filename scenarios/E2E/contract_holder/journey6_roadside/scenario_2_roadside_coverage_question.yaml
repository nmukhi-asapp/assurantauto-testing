company_marker: assurantauto
customer:
  customer_id: CHI-017
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Understand exactly what roadside assistance services are included before your road trip
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I am going on
    a long road trip next week. What roadside help do I have if something goes wrong?'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Proactive and organized. Planning ahead. Asks specific questions about what is covered.
description: Customer asking about roadside assistance coverage details before an upcoming road trip
evaluations:
- rules:
  - Agent offers the self-service portal website to the caller
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's substantive questions
- rules:
  - Agent provides roadside coverage details including the RSA administrator phone number from the contract data
- rules:
  - Agent describes what types of roadside services are available based on the contract terms
- rules:
  - Agent provides any coverage limits or conditions from the contract terms
- rules:
  - Agent does NOT escalate since this is an informational inquiry with no immediate emergency
- rules:
  - Agent answers the question using the available contract data without asking the customer to call back
- applicability:
  - The agent escalated the call or transferred to a human agent
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent speaks out a phone number to the customer
  rules:
  - 'The phone number is spoken digit by digit in groups of 3, 3, and 4, with digits within
    each group separated by commas and each group followed by a period. The complete number
    is then repeated once more for confirmation. For example, for 1-866-603-5420: 8, 6, 6.
    6, 0, 3. 5, 4, 2, 0. 8, 6, 6. 6, 0, 3. 5, 4, 2, 0.'
id: e2e_journey6_roadside_coverage_info
