company_marker: assurantauto
customer:
  customer_id: DLR-002
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are a Dealership
  - When offered the portal, say you prefer to handle it over the phone
  - Ask about the status of your claim — you received a denial notice and want to
    understand why
  - If the agent cannot resolve it, accept being transferred to a specialist
  knowledge: You are calling from Sunset Chevrolet. A customer's claim (37030002)
    on contract VSC300002 was denied. The VIN is 1C4BJWDG5HL300002 (last 8 are HL300002).
    You want to understand why the claim was denied and what options exist. If asked
    your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Professional but frustrated. Wants a clear
    explanation. Will cooperate with the agent but expects to be transferred to someone
    who can help.
description: Dealership calling about a denied claim — agent looks up status and escalates
  to specialist
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent asks for a claim identifier and looks up the claim using an available claim
    lookup function
- rules:
  - Agent identifies the claim status as Denied and communicates the longVerbiageStatus
    to the caller
- rules:
  - Agent escalates using escalate_to_agent_from_ivr, OR informs the customer that
    agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'CLAIMSTATUS'
- rules:
  - ClaimStatus is set to 'ClaimNotAuthorized'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Dealership: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM,
    COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
