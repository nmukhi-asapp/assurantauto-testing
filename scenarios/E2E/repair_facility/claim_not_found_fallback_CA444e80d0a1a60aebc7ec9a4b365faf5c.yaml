company_marker: assurantauto
customer:
  customer_id: RF-007
  evaluation_goals: null
  goals:
  - You are a repair facility. When the agent asks your caller type, say you are a repair facility
  - Ask for the status of claim number 47263316
  - If the agent says the claim was not found, offer to provide the contract number instead (VSC200007)
  knowledge: You are calling from Precision Auto Repair. You are asking about claim 47263316. The contract number for this
    vehicle is VSC200007 and the last 8 of the VIN is KF100007. If the claim lookup fails, you can provide the contract number
    or last 8 VIN.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Patient but persistent. Will provide alternative identifiers if asked.
description: Repair facility asking for claim status — when claim number lookup fails, agent must clearly inform the caller
  the claim was not found and offer alternative lookup options (contract number or last 8 VIN), not keep re-asking for the
  same claim number
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent attempts claim lookup using the provided claim number
- rules:
  - When the claim is not found, agent clearly tells the caller the claim could not be found
- rules:
  - After a failed claim lookup, agent offers to look up using an alternative identifier — contract number OR last 8 digits
    of VIN
- rules:
  - Agent does NOT repeatedly ask the caller to restate the same claim number without offering alternative identifiers
- rules:
  - Agent successfully retrieves the claim when provided the contract number as an alternative identifier
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
