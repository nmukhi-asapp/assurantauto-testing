company_marker: assurantauto
customer:
  customer_id: CHI-033
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask for help with your service contract
  - When the agent asks for a contract number, claim number, or VIN, provide your full 17-character VIN '1HGCV1F30ZA999033'
  - If the agent asks what type of number that is, say it is your VIN
  - When the agent reads back the VIN and asks you to confirm, say yes
  - If the first lookup fails and the agent asks for a different identifier, provide your claim number 'CLM999033'
  - When the agent reads back the claim number and asks you to confirm, say yes
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Your full VIN is 1HGCV1F30ZA999033
    (last 8 are ZA999033). Your claim number is CLM999033. Start by saying 'I need help with my contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Helpful and cooperative. Reads out full VIN when asked. Provides claim number when asked for a different identifier.
description: "Initial ANI lookup returns success: false (no PhoneNumber provided).
  Agent asks for a manual identifier (Step A). Customer provides full 17-character
  VIN — agent extracts last 8 (ZA999033), confirms with customer (Step C), then calls
  get_contract_and_claims_data_ivr with the VIN — that lookup fails (Step E). Agent asks for a different identifier.
  Customer provides claim number, confirms it. Agent calls get_contract_and_claims_data_ivr with the claim number — that
  also fails. Agent escalates via Unified Escalation Protocol after two failed identifier
  attempts. Also verifies agent does NOT ask customer to repeat just the last 8 of
  the VIN."
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent asks the customer to provide their claim number, contract number, or the last 8 characters of their VIN
- rules:
  - Agent accepts the full 17-character VIN without asking the customer to repeat just the last 8 characters
- rules:
  - Agent reads back the VIN to the customer and asks them to confirm before making the API call
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the VIN and receives a not-found or failure response
- rules:
  - Agent informs the customer it could not find a record with that VIN and asks for a different identifier
- rules:
  - Agent does NOT ask for the VIN again — it asks for a contract number or claim number instead
- rules:
  - Agent reads back the claim number to the customer and asks them to confirm before making the API call
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the claim number and receives a not-found or failure response
- rules:
  - Agent escalates using escalate_to_agent_from_ivr after two failed customer-provided identifier lookup attempts (the initial automatic phone number lookup does not count)
- rules:
  - Agent apologizes and informs the customer they will be connected to a specialist
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
