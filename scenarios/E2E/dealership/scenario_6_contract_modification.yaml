company_marker: assurantauto
customer:
  customer_id: DLR-006
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - When offered the portal, say you prefer to handle it over the phone
  - Explain that a customer wants to make a change to their service contract — they want to add GAP coverage
  - Accept being transferred to the appropriate team
  knowledge: You are calling from Eastside BMW. One of your customers (contract VSC300006) purchased a
    service contract but now wants to add GAP coverage as an amendment. You are calling on their behalf
    to find out how to make this contract modification. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional dealership finance manager. Polite and organized. Familiar with contract modifications and expects to be transferred to the right department.
description: Dealership requesting a contract modification (adding GAP coverage) on behalf of a customer — escalates to specialist
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent identifies the caller's issue as a contract change or modification
- rules:
  - Agent escalates using escalate_to_agent_from_ivr, OR informs the customer that agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'CONTRACTCHANGES' or 'GAP'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'GAP'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
