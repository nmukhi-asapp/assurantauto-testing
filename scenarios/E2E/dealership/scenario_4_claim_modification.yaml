company_marker: assurantauto
customer:
  customer_id: DLR-004
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - When offered the portal, say you prefer to handle it over the phone
  - Explain that you need to add additional parts to an existing claim — the technician found a related component that also
    needs replacement
  - Accept being transferred to someone who can process the modification
  knowledge: You are calling from Riverside Honda. You have an existing claim (37030004A, contract VSC300004) for a water
    pump replacement on a 2019 Honda CR-V (VIN 2HKRW2H88KH300004, last 8 KH300004). After disassembly, the technician found
    the thermostat housing also needs replacement. You need to add this to the claim. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Experienced service advisor. Explains the situation clearly. Understands escalation may be needed and will cooperate.
description: Dealership needs to modify an existing claim to add additional parts — agent escalates to claims team
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent categorizes the inquiry as a claim modification
- rules:
  - Agent looks up the claim using an available claim lookup function
- rules:
  - Agent escalates using escalate_to_agent_from_ivr to process the modification, OR informs the customer that agents are
    not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - GAIntent is set to 'UPDATECLAIM'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL,
    CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
