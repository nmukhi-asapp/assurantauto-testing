company_marker: assurantauto
customer:
  customer_id: CH-DC-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - When the agent says you have two contracts, ask what the difference is between them (what does each one cover)
  - After the agent explains both contracts, tell them you want to ask about the service contract
  - Ask whether airbag replacement is covered under that contract
  knowledge: You are ROSS MCFATE, calling about your 2018 Kia Stinger. You have two
    contracts with Assurant and want to understand what each covers before asking a
    specific coverage question. Once the agent explains them, you will focus on the
    service contract and ask about airbag replacement coverage. If asked your caller
    type, say Contract Holder.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract Holder.", "Service contract.", "Yeah."). Confirmations are single words
    or short phrases only ("Yes.", "That's right."). For open-ended questions, gives
    a direct fragment of 5-8 words — never full sentences, never explanations. Never
    volunteers context or reasons. Occasional natural fillers before a response ("Uh,",
    "Yeah,").
description: Contract holder with two active contracts on the same vehicle (a Service
  Contract and a Limited Warranty) is disambiguated by contract type, gets a clear
  explanation of what each covers, selects the service contract, and asks about airbag
  coverage
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a
    Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr to retrieve contract data before
    responding
- rules:
  - When presenting two contracts for the same 2018 Kia Stinger, the agent disambiguates
    by contract type (e.g. "Service Contract" vs "Limited Warranty") rather than repeating
    the vehicle name twice
- rules:
  - When the customer asks what each contract covers, the agent clearly explains that
    the Service Contract has broad coverage (all factory-installed components except
    exclusions) while the Limited Warranty covers powertrain components only
- rules:
  - After the customer indicates interest in the service contract, the agent answers
    the airbag coverage question using the terms of the Service Contract (contractNumber
    AM6RA1222HH), not the Limited Warranty
- rules:
  - Agent answers that airbag components are covered under the Service Contract when
    failure is due to a mechanical or electrical defect (not a collision or deployment
    event)
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent to answer
    the contract explanation or airbag coverage questions
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS,
    NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
