company_marker: assurantauto
customer:
  customer_id: RF-008
  evaluation_goals: null
  goals:
  - You are a repair facility. When the agent asks your caller type, say you are a repair facility
  - Ask about the status of a claim (claim number 47353676) for a vehicle currently in your shop
  - When the agent gives you the claim status, ask what the status means and what you should do next
  knowledge: You are calling from Marietta Auto Repair in Marietta, GA. You are asking about claim 47353676. The last 8 of
    the VIN is GA100008. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional repair shop staff. Needs clear information to proceed with the repair.
description: Repair facility asking about claim status — agent must use the term 'independent repair facilities' (not 'independent
  repair shops'); must provide extended claim status explanation (not just a short status code)
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent does NOT use the terms 'repair shop' or 'independent repair shop' (it is
    acceptable to use 'repair facility' / 'independent repair facility', or to not
    reference the term at all)
- rules:
  - Agent looks up the claim using the provided claim number or last 8 VIN
- rules:
  - Agent provides an extended status description (longVerbiageStatus) explaining what the status means, not just a short
    status label
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent without first communicating the extended claim
    status to the caller
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
