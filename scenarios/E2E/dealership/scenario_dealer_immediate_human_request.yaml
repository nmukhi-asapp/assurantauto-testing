company_marker: assurantauto
customer:
  customer_id: DLR-020
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are a Dealership
  - Immediately say you need to speak to a person — you need to make changes to a
    customer's contract
  - If the agent asks what you need help with, explain that you need to modify a customer's
    service contract terms because the vehicle was involved in a trade-in
  - If the agent tries to handle it through the IVR, insist you need a human
  knowledge: You are calling from Metro Ford. A customer traded in their vehicle and
    you need to modify or transfer their service contract (VSC300020) to a new vehicle.
    This requires human assistance. If asked your caller type, say Dealership. Your
    dealer ID is 000TX099.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Professional dealership service manager. Efficient
    and direct. Knows contract modifications require human agents and is not interested
    in self-service options for this.
description: Dealership immediately requests a live agent to handle a contract modification
  (trade-in transfer) — something the IVR cannot process. Agent should ask what the
  caller needs before escalating, recognize the contract modification is outside IVR
  scope, and escalate via escalate_to_agent_from_ivr.
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent asks what the caller needs help with before escalating, rather than blindly
    escalating on the request alone
- rules:
  - Caller explains they need to modify or transfer a service contract
- rules:
  - Agent recognizes the contract modification cannot be processed through the IVR
    and escalates using escalate_to_agent_from_ivr, OR informs the customer that agents
    are not currently available due to business hours
- rules:
  - Agent informs the caller they will be connected to the appropriate team, OR informs
    the customer that agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Dealership: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- rules:
  - Agent identifies and acknowledges that the caller's need is a contract modification
    or transfer
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
