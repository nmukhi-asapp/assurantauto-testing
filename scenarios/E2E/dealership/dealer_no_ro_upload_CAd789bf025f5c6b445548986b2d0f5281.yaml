company_marker: assurantauto
customer:
  customer_id: DLR-007
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - Tell the agent you want to start a new claim for a customer vehicle
  - If the agent says you need to upload a Repair Order, say you thought that was optional for dealers
  - If offered the portal, say you prefer to handle it over the phone
  knowledge: You are calling from Westside Auto Group. A customer (VIN 4T1BF1FK5HU300007, last 8 HU300007, contract VSC300007) brought in their 2017 Toyota Camry for a brake issue. You believe dealers are not required to upload a Repair Order. If asked your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional service advisor who is familiar with the process and will push back if told something incorrect.
description: Dealership starting a new claim — agent must NOT tell dealer they are required to upload RO (dealers are not required to); should refer to dealer portal (autorepairs.assurant.com); if caller prefers phone, have RO and VIN ready and transfer
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent does NOT tell the dealership they are required to upload a Repair Order
- rules:
  - Agent does NOT direct the dealership to autoclaims.com
- rules:
  - When caller prefers the phone, agent instructs them to have the Repair Order and VIN ready, then transfers to a claims adjuster
- rules:
  - The caller provided the vehicle VIN to the agent before the call was transferred to a claims adjuster
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
id: e2e_dealership_no_ro_upload_required
