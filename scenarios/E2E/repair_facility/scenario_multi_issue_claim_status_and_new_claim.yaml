company_marker: assurantauto
customer:
  customer_id: RF-MI-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a repair facility
  - When offered the portal, say you prefer to handle it over the phone
  - Ask about the status of claim 47407207 on contract VSC190001
  - When the agent tells you the status is Under Review, ask what exactly that means and what you should expect to happen
    next
  - After the agent answers, say you also have a new customer vehicle coming in and want to know how to start a new claim
    — the customer has contract VSC190001 and the vehicle is a 2021 Honda Pilot (VIN 5FNYF6H93MB190001, last 8 MB190001)
  knowledge: You are calling from Summit Auto Service. You have an existing claim 47407207 on contract VSC190001 for a 2020
    Ford Explorer (VIN 1FM5K8D8LGB190001, last 8 GB190001). The claim was submitted for a transmission issue. You want to
    know the status and what it means. You also have a second new customer coming in with contract VSC190001 and want to know
    how to start a claim. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Experienced service advisor. Asks follow-up questions when status language is unclear. Expects practical guidance without being transferred for every question.
description: Repair facility with two issues — asks about existing claim status, asks what the status means (follow-up), then
  asks about starting a new claim for a different vehicle
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up claim 47407207 using an available claim lookup function
- rules:
  - Agent communicates the claim status (Under Review) to the caller
- rules:
  - Agent explains what the Under Review status means using the longVerbiageStatus or equivalent explanation, without escalating
    to a human agent for this question
- rules:
  - Agent addresses the caller's second issue (starting a new claim) without requiring a new call or immediately escalating
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent solely because the caller asked what the status
    means
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
