company_marker: assurantauto
customer:
  customer_id: RF-MI-002
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are a repair facility
  - When offered the portal, say you prefer to handle it over the phone
  - Tell the agent you have a customer vehicle in for diagnosis and want to know if
    the repair is covered before starting a claim — specifically whether a failed
    power steering pump is covered under contract VSC190002
  - If the agent asks for more details, provide the VIN last 8 as AB190002
  - If the agent confirms coverage or explains the process, ask whether you need pre-authorization
    before starting the repair
  knowledge: You are calling from Clearwater Automotive. A customer brought in their
    2020 Chevrolet Equinox (VIN 2GNAXKEV0L6190002, last 8 L6190002, contract VSC190002)
    for a diagnosis. You found a failed power steering pump. Before submitting a claim,
    you want to confirm the repair is likely covered and understand the authorization
    process. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Detail-oriented. Wants to understand the coverage
    and authorization process before committing to the repair. Will ask follow-up
    questions about pre-authorization requirements.
description: Repair facility asks whether a specific repair (power steering pump)
  is covered under a contract before filing a claim, then asks about the pre-authorization
  process
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the contract or claim data to check coverage for the vehicle
- rules:
  - Agent uses the contract coverage information to address whether the repair type
    may be covered, without immediately escalating
- rules:
  - Agent explains the pre-authorization requirement (caller must get authorization
    before repairs begin) using available contract or process knowledge
- rules:
  - Agent does NOT call escalate_to_agent_from_ivr or escalate_to_live_agent solely
    because the caller asked about coverage eligibility before filing
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM,
    NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
