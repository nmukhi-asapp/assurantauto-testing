company_marker: assurantauto
customer:
  customer_id: CHI-035
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Start by saying you need to file a claim
  - When the agent asks what is wrong with the car, say the A/C compressor stopped working
  - Follow the agent's guidance on next steps
  knowledge: If asked to identify yourself as a caller type, say you are a Contract
    Holder. Your A/C compressor failed and you want to get it repaired under your
    service contract. You think of this as filing a claim. Start by saying 'I need
    to file a claim.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Believes they are talking to a dumb automated IVR phone system. Gives extremely terse, fragmented responses — things like 'repair', 'warranty', 'car broke', 'fix it'. Does not volunteer extra information. Only elaborates slightly if directly asked a specific question.
description: Contract holder opens the call by saying they need to file a claim, without
  describing the underlying mechanical issue. The agent must probe to understand what
  the issue is, then guide them through the repair authorization process the same way
  it would for any mechanical repair — recommending the selling dealer, explaining
  that the repair facility contacts Assurant for authorization, and not confirming
  specific coverage.
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's substantive questions
- rules:
  - Agent asks what is wrong with the car or what the claim is about, rather than immediately escalating or assuming
- rules:
  - Agent explains that the repair facility must contact Assurant to authorize the claim
- rules:
  - Agent recommends the selling dealer (Lakeside Motor Group) as the first option for repairs before mentioning independent
    repair facilities
- rules:
  - Agent does NOT confirm that the A/C compressor repair is specifically covered
- rules:
  - Agent provides the basic steps for the repair authorization process
- rules:
  - Agent does NOT say 'vehicle service contract' — must refer to it simply as 'contract' or 'coverage'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
