company_marker: assurantauto
customer:
  customer_id: RF-009
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Explain that you emailed the Repair Order yesterday and received a case number (CASE-RF-009)
    by email, but you were not sure what to do next and have not yet filed the claim
  - Ask what you should do with the case number
  knowledge: You are calling from Sunrise Auto Service. Yesterday you emailed the Repair
    Order to ro@autoclaims.com for a 2021 Honda Civic (VIN 2HGFC2F63MH200009, last
    8 MH200009, contract VSC200009) with a power steering failure at 47,000 miles.
    You received an email response with case number CASE-RF-009, but were not sure
    what to do next and have not yet filed the claim online. If asked your caller type,
    say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Slightly confused about the process. Not very tech-savvy. Needs clear guidance on the next steps after receiving the case number email.
description: Repair facility emailed the RO and received a case number but never completed
  filing online — no claim exists yet, no lookup attempted, agent directs caller to
  use their case number to file the claim online
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent does NOT attempt a claim lookup (no claim exists yet)
- rules:
  - Agent directs the caller to use their case number to file the claim online
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
