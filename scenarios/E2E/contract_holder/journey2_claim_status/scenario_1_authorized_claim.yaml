company_marker: assurantauto
customer:
  customer_id: CHI-003
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Find out the current status of your repair claim
  - After hearing the status, ask if there is anything else you need to do before the repair facility can proceed
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'I wanted to check
    on the status of my claim. Has it been approved?'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Polite and patient. Speaks clearly. Appreciative of information provided.
description: Customer checking status of claim that has been authorized for repairs
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's substantive questions
- rules:
  - Agent communicates to the customer that their claim has been authorized or approved
- rules:
  - Agent communicates both that the covered portion of the claim was authorized AND that an authorization letter was sent
    to the repair facility
- rules:
  - Agent explains that the repair facility may proceed with the covered repairs
- rules:
  - Agent asks if the customer has any further questions
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
