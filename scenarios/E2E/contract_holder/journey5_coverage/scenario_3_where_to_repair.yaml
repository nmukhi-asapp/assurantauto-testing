company_marker: assurantauto
customer:
  customer_id: CHI-015
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Find out if you can use your trusted local mechanic or if you are required to use a specific dealer
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Start by saying 'Can I take my
    car to any mechanic, or do I have to go to a specific dealer?'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Practical and direct. Wants clear policy information. Values the convenience of using their own mechanic.
description: Customer asking whether they can use any repair shop or must go to a specific dealer
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's substantive questions
- rules:
  - Agent recommends the selling dealer (Texas Auto Group) as the first option before mentioning independent repair facilities
- rules:
  - Agent clarifies the customer may also use any licensed independent repair facility of their choice
- rules:
  - Agent explains the repair facility must contact Assurant for authorization before starting work
- rules:
  - Agent does NOT use the term 'repair shop' or 'independent repair shop' — must say 'repair facility' or 'independent repair
    facility'
- rules:
  - Agent provides accurate policy information from the contract terms
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
