company_marker: assurantauto
customer:
  customer_id: RT-004
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a repair facility, dealer, or calling about a personal contract, say you are calling
    about your personal vehicle service contract
  - Ask about your warranty coverage for your personal vehicle
  knowledge: Your phone number is registered as a repair facility in the Assurant system, but you are calling about a personal
    vehicle service contract (you are both a shop owner and a contract holder for your personal car). When asked to identify
    yourself during the disambiguation step, say you are calling about your personal contract — not that you are a repair
    facility or dealer.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Shop owner who also has a personal vehicle service contract. Cooperative with whatever flow the agent starts. When given the disambiguation options, clearly states they are calling about their personal contract.
description: ANI identifies caller as repair facility but caller identifies as personal contract holder — agent should route
  to ContractHolderIssues
evaluations:
- rules:
  - When is_repair_facility returns true but caller identifies as a personal contract holder during disambiguation, agent
    routes to ContractHolderIssues
- rules:
  - Agent does NOT route to RepairShopIssues when the caller identifies as calling about a personal contract
