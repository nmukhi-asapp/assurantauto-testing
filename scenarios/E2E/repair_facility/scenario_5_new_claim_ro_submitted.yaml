company_marker: assurantauto
customer:
  customer_id: RF-005
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you emailed the Repair Order yesterday, received a case number, and used it to file the claim online —
    you now want to check the status
  - Provide claim number 37020205A when asked
  knowledge: You are calling from Northside Collision and Auto. Yesterday you emailed the Repair Order to ro@autoclaims.com
    for a 2020 Kia Sorento (VIN KNDMC5C10L2200005, last 8 L2200005, contract VSC200005). You received a case number by email
    and used it to complete filing online. The claim number is 37020205A. You are calling to check authorization status because
    you need to order parts. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Efficient and proactive. Already completed the full filing process and just needs a status update. Slightly frustrated if the agent tries to walk through steps they have already completed.
description: Repair facility following up on a newly submitted claim — RO was emailed, case number received, claim filed online.
  Claim lookup succeeds and agent communicates status.
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using the provided claim number or identifier
- rules:
  - Agent communicates the current status of the submitted claim to the caller
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
