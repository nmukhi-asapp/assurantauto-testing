company_marker: assurantauto
customer:
  customer_id: RF-020
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a customer, dealer, repair facility, or Assurant employee, say you are an independent repair facility
  - When asked what you need help with, say you are checking on an existing claim
  - When the agent asks for a claim number, contract number, or the last 8 characters of the VIN, say "Claim number"
  - When the agent asks you to provide the claim number, say it is "four nine one four eight nine eight two" (49148982)
  - When the agent reads back the number and asks you to confirm, say yes
  knowledge: You are calling from an independent repair facility. You have a customer vehicle with an active claim. The claim
    number is 49148982. Start by saying you need to check on an existing claim.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and efficient.
description: "Production regression test: repair facility states identifier type ('Claim number') when asked to provide a claim
  number, contract number, or VIN. Agent should ask for the claim number and proceed to confirmation without re-asking 'Is
  that your claim number, contract number, or VIN?' after the customer provides the number. Based on production conversation
  0482211455-1150947825-2550392065-1638018563 where this failure was observed."
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent calls get_contract_and_claims_data_ivr using the PhoneNumber and receives a failure response
- rules:
  - Agent asks the caller to provide their claim number, contract number, or the last 8 characters of the VIN
- rules:
  - After the caller says "Claim number", agent asks for the claim number without first asking the caller to clarify what
    type of identifier they are providing
- rules:
  - Agent does NOT ask "Is that your claim number, your contract number, or the last 8 characters of your VIN?" after the
    customer has already stated they are providing a claim number
- rules:
  - Agent reads back the claim number 49148982 to the caller and asks them to confirm before making the API call
- rules:
  - Agent calls getClaimsClaimNumber with claim number 49148982
- rules:
  - Agent provides the claim status to the repair facility
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
