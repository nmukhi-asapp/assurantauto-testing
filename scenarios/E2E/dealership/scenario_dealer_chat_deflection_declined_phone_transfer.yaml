company_marker: assurantauto
customer:
  customer_id: DLR-022
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a Dealership
  - Start by saying you need to speak to a representative
  - When the agent asks what you need help with, say you need to check on a claim for a customer
  - When asked for an identifier, provide your contract number VSC300022
  - When the agent reads back the contract number, confirm it is correct
  - When the agent provides the claim status, say you still want to speak to a phone agent
  knowledge: You are calling from Westside Auto Group. A customer brought in their 2021 Jeep Grand
    Cherokee (VIN 1C4RJFBG5MC771022, last 8 MC771022, contract VSC300022) for an engine repair.
    Claim 47030022A was filed and you want to confirm its status. If asked your caller type, say
    Dealership. You want to speak to a phone agent.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers
    specific options, answers with just the matching option in 1-3 words ("Contract.", "Dealership.",
    "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's
    correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences,
    never explanations. Never volunteers context or reasons. Occasional natural fillers before a
    response ("Uh,", "Yeah,"). Professional dealership service advisor who wants to speak to a phone agent.
description: Dealership caller immediately requests a phone agent. Agent must collect an identifier
  (claim number, contract number, or VIN) and ultimately transfer the caller to a phone agent via
  escalate_to_agent_from_ivr.
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent asks for a claim number, contract number, or VIN before transferring to a phone agent
- rules:
  - Agent eventually calls escalate_to_agent_from_ivr to transfer the caller to a phone agent
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'The GAIntent output variable is set to one of the valid values for Dealership: CARRENTAL,
    CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, RV, GA_ERROR, ALLOTHER_QUESTIONS,
    DEFAULT'
