id: e2e_ch_tieback_requirement
company_marker: assurantauto
description: Contract holder calls wanting to start a repair claim. Their contract
  has a 40-mile tieback clause requiring them to return to their selling dealer if
  the vehicle is within 40 miles of the dealer. GenAgent should advise the customer
  of the tieback requirement, name the selling dealer, provide the phone number, and
  ask if they want to be walked through the steps.
tags:
- e2e
- contract_holder
- journey1_mechanical
- tieback
- selling_dealer
customer:
  customer_id: CHI-tieback-001
  evaluation_goals:
  - evaluation_goal: The agent informs the customer of the tieback requirement, naming
      the selling dealer and the distance threshold before recommending any repair
      facility.
    is_possible: true
  - evaluation_goal: The agent provides the selling dealer's name and phone number
      as part of the tieback guidance.
    is_possible: true
  goals:
  - When the agent asks how it can help, say you need to get a repair started on your
    vehicle — it has a mechanical issue
  - If the agent mentions your selling dealer and the tieback requirement, confirm
    you understand and ask for the steps to get the claim started
  - When the agent walks you through the claim steps, confirm you understand and say
    that is all you needed
  knowledge: You are calling about your 2025 Hyundai Santa Fe (contract number AMA6A13H601).
    Your vehicle needs a mechanical repair. You want to know how to get a repair claim
    started. You are not aware of any tieback requirement on your contract.
  personality: Responds like a real caller on a phone IVR. Terse but cooperative.
    Answers in short sentences. Confirms information when the agent provides it. Does
    not volunteer extra details unless asked. Willing to follow the agent's guidance
    on next steps.
evaluations:
- rules:
  - Agent routes to ContractHolderIssues after identifying the caller as a contract
    holder
- rules:
  - Agent advises the customer that their contract has a tieback requirement — specifically
    that the vehicle should go to the selling dealer first because it is within the
    tieback distance
- rules:
  - Agent names the selling dealer (Key Hyundai of Salem) and provides their phone
    number as part of the tieback guidance
- rules:
  - Agent does NOT skip the tieback requirement and recommend a generic repair facility
    without mentioning the selling dealer first
- rules:
  - Agent asks if the customer would like to be walked through the steps to get the
    claim started
