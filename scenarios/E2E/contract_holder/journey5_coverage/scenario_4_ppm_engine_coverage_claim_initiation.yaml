company_marker: assurantauto
description: Contract holder with a PPM (Pre-paid Maintenance) plan asks whether engine
  repair is covered, then asks how to file a claim after a repair shop has already
  diagnosed the issue. Call resolves self-service with no escalation.
id: e2e_journey5_ppm_engine_coverage_claim_initiation
tags:
- e2e
- contract_holder
- journey5
- coverage
customer:
  customer_id: CH-PPM-001
  goals:
  - When asked what type of caller you are, say you are a customer.
  - Ask if engine repair is covered under your warranty.
  - When told it is not covered, ask how to file a claim anyway (the repair shop has
    already diagnosed the issue and you want to get the process started).
  - When the agent explains that the repair facility must contact Assurant before
    repairs begin, confirm you understand and decline the offer of the repair facility's
    contact information.
  - Confirm you have no further questions when asked.
  knowledge: You have a question about your warranty. You have a 2022 Ford Explorer
    XLT. The repair shop has already diagnosed a problem with the engine and you want
    to know if it is covered and how to get a claim started. You do not have the repair
    shop's contact number handy.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When
    the agent offers specific options, answers with just the matching option in 1-3
    words ("Contract.", "Customer.", "Engine."). Confirmations are single words or
    short phrases only ("Yeah.", "No. I'm good.", "Nope."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Occasional natural fillers ("Uh,"). Polite
    and patient.
  evaluation_goals: null
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as
    a customer/contract holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's
    substantive questions
- rules:
  - Agent correctly identifies the contract as a Pre-paid Maintenance (PPM) agreement,
    not a mechanical breakdown warranty
- rules:
  - Agent informs the customer that engine repair is NOT covered under their Pre-paid
    Maintenance agreement
- rules:
  - Agent explains what the PPM agreement does cover (oil changes, filter changes,
    lubrication, multipoint inspections)
- rules:
  - Agent explains that the repair facility — not the customer — must contact Assurant
    before repairs begin in order to initiate a claim
- rules:
  - Agent asks if the customer has any further questions before ending the call
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS,
    NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
customer_evaluations: null
all_goals_achievable: true
