              termsStructuredText: "Vehicle Service Contract\nFor New & Pre-Owned Vehicles\nINFORMATION SCHEDULE\n\nDEDUCTIBLE\n\
                A deductible of $100 applies per repair visit when using a Selling Dealer\nNetwork repair facility. A deductible\
                \ of $200 applies per repair visit when\nusing an Out-of-Network repair facility. The deductible is collected\
                \ by the\nrepair facility at the time of repair completion.\n\nYOUR RESPONSIBILITIES\nTo maintain coverage\
                \ under this Vehicle Service Contract, you must:\n- Obtain pre-authorization from Assurant BEFORE any covered\
                \ repairs begin.\n  Contact your selling dealer or take your vehicle to an approved repair facility to start a claim.\n- Follow the\
                \ vehicle manufacturer's recommended maintenance schedule as\n  outlined in your owner's manual. Keep records\
                \ of all maintenance performed.\n- Take your vehicle to a licensed repair facility for all covered repairs.\n\
                - Pay the applicable deductible at the time of repair.\n- Not authorize repairs or replacement of parts without\
                \ Assurant authorization,\n  except in the case of emergency repairs necessary to prevent further damage.\n\
                Failure to follow these responsibilities may result in denial of a claim.\n\nCOVERED COMPONENTS\nThis contract\
                \ covers mechanical and electrical failures of: engine components,\ntransmission and drive axle, steering\
                \ system, brakes, air conditioning and\nheating, electrical systems, suspension components, and fuel system.\n\
                Coverage is for components that fail due to mechanical or electrical breakdown,\nnot from accident, collision,\
                \ or normal wear.\n\nEXCLUSIONS — WHAT IS NOT COVERED\nThis contract does NOT cover:\n- Routine maintenance\
                \ items: oil changes, oil filter replacements, air filters,\n  fuel filters, spark plugs, tire rotations,\
                \ wheel balancing, wiper blades,\n  brake pads and shoes from normal wear, belts and hoses from normal wear.\n\
                - Cosmetic items: paint, trim, upholstery, glass (unless caused by a covered\n  mechanical failure).\n- Damage\
                \ from accidents, collisions, flooding, fire, theft, or vandalism.\n- Pre-existing conditions that were known\
                \ or should have been known at the\n  time of purchase.\n- Damage caused by failure to follow the maintenance\
                \ requirements of this\n  contract or the manufacturer's maintenance schedule.\n- Tires and wheels.\n\nRENTAL\
                \ COVERAGE\nRental car reimbursement up to $35 per day, maximum 10 days per breakdown,\nwhile your vehicle\
                \ is at a repair facility for a covered repair.\nCall 1-800-752-6265 for rental inquiries.\n\nROADSIDE ASSISTANCE\n\
                24-hour emergency roadside assistance: 1-866-603-5420\n\nRA-MAO-NTB-TFS (05/17)"
