company_marker: assurantauto
customer:
  customer_id: RF-PROFANITY-001
  evaluation_goals: null
  goals:
  - Identify as a repair facility calling about an existing claim status
  - When asked for an identifier, provide claim number 50381200
  - After the agent reports the claim is under review, express frustration using mild
    profanity (e.g., "What the hell? It's been two weeks!") before asking for a live
    agent
  - Request to be transferred to a claims agent
  knowledge: You are calling from Highland RV & Auto, an independent repair facility.
    A customer brought in a 2022 Ford Explorer (VIN 5ZT2CKEC8PZ128784) for transmission
    slippage. You submitted the claim and received claim number 50381200. The contract
    number is ARV2X60413. The last 8 characters of the VIN are PZ128784. You want to
    know the status. The claim has been sitting for two weeks with no update and you
    are frustrated.
  personality: Impatient repair facility service advisor. Terse and direct — answers
    in 1-5 word fragments, not full sentences. Familiar with the claims process. Gets
    frustrated at delays and vents with mild profanity when annoyed ("What the hell?",
    "Are you serious?", "What the f—?") — not threatening the agent, just venting.
    Profanity is incidental, not a demand. After venting, continues the call and cooperates.
    When told the claim is "under review" after two weeks, responds with something like
    "What the hell, two weeks and it's still under review?" before asking to speak with
    someone.
description: RF caller checks existing claim status, uses mild profanity out of frustration
  when told the claim is under review. Agent must handle gracefully — acknowledge frustration,
  continue the flow, and escalate to claims when requested.
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using claim number, contract number, or VIN last 8
- rules:
  - Agent provides the claim status (under review) to the caller
- rules:
  - When the caller uses profanity, the agent does NOT respond with a refusal such
    as "I can't assist with that", "I'm unable to help with that", or any phrase that
    treats the profanity as an out-of-scope request
- rules:
  - When the caller uses profanity, the agent does NOT end the call, suggest the caller
    call back, or otherwise disengage
- rules:
  - When the caller uses profanity, the agent acknowledges the caller's frustration
    and continues assisting
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM,
    NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
