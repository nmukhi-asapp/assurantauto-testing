company_marker: assurantauto
customer:
  customer_id: RF-007
  evaluation_goals: null
  goals:
  - You are a repair facility. When the agent asks your caller type, say you are a repair facility
  - Tell the agent you need to submit a Repair Order for a new claim
  - Ask how you should send the Repair Order to Assurant
  knowledge: You are calling from Precision Auto Repair. A customer brought in a 2019 Chevrolet Malibu (VIN 1G1ZD5ST6KF100007, last 8 KF100007, contract VSC200007) for engine work. You need to submit a Repair Order for a new claim. You want to know the correct way to submit the RO.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional repair shop manager. Wants to follow the correct process precisely.
description: Repair facility asking how to submit a Repair Order — agent must direct them to EMAIL the RO to ro@autoclaims.com, NOT tell them to upload via a portal
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - When discussing Repair Order submission, agent directs the RF to email the RO to ro@autoclaims.com
- rules:
  - Agent does NOT tell the repair facility to upload the Repair Order directly through
    a web portal (e.g. does NOT say 'upload via the portal' or direct them to submit
    it through autorepairs.assurant.com or autoclaims.com upload form)
- rules:
  - Agent does NOT reference autorepairs.assurant.com for repair facility RO submission (that portal is for dealerships)
- rules:
  - Agent explains that after emailing the RO, the caller will receive an email response
    with a case number they can use to file the claim online
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
