company_marker: assurantauto
customer:
  customer_id: RF-002
  evaluation_goals: null
  goals:
  - Check payment status on an existing claim (claim number 37020202A) that has already been authorized and repairs completed
  - Ask when to expect payment and to which address the check will be sent
  knowledge: You are calling from Riverside Auto Service. Yesterday you completed repairs on a 2021 Ford F-150 (VIN 1FTFW1E8MFA200002,
    last 8 of VIN FA200002) two weeks ago under claim number 37020202A. The contract number is VSC200002. The claim was authorized
    and repairs were completed on 2026-02-06. You are calling today to follow up on payment status as you have not yet received
    payment.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and slightly impatient. Has been waiting for payment for two weeks and wants a clear answer. Will press for specifics on timeline if given a vague response.
description: Repair facility following up on payment for a completed claim where repairs are done
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim using the claim number or other identifier provided
- rules:
  - Agent provides the payment status and explains next steps for payment
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
