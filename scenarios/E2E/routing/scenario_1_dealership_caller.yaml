company_marker: assurantauto
customer:
  customer_id: RT-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Dealership
  - Ask about a customer who purchased a service contract through your dealership and has a question about a claim
  knowledge: You are calling from Greenfield Ford, an authorized selling dealer. A customer of yours (John Williams) purchased
    a service contract through your dealership and has contacted you with a question about an active claim. You are calling
    on his behalf to get more information. Your dealer ID is 000TX099. If asked what type of caller you are, say you are a
    Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional dealership service advisor. Accustomed to working with warranty administrators. Gives clear, concise information about the customer and claim details.
description: Selling dealership calling on behalf of a customer — CallerIdentification should route to Dealership/SellingDealer
  flow
evaluations:
- rules:
  - Agent does not route to RepairShopIssues (is_repair_facility returns false)
- rules:
  - Agent asks the caller to identify their caller type (Contract Holder, Dealership, or Assurant Employee)
- rules:
  - Agent routes to the Dealership or Selling Dealer service flow, or escalates appropriately for dealership callers
