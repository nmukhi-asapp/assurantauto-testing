company_marker: assurantauto
customer:
  customer_id: CHI-036
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Start by saying you need to speak to a human agent
  - When the agent asks what you need help with, say you want to check the status of your claim
  - When the agent provides the claim status, accept the information and ask if your repair facility can proceed with the
    repair
  - Accept the agent's guidance without insisting on a human transfer
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. You have an open claim (status
    Authorization Approved) on your 2020 Honda Accord. You want to know if the repair can proceed. Start by saying 'I need
    to talk to a human agent.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Initially resistant to the IVR but becomes cooperative once the agent demonstrates it can actually help. Accepts the information when it is provided clearly.
description: Contract holder opens with a human request, but their actual need — checking an approved claim status — is fully
  within the IVR's scope (Journey 2). Agent should ask what the caller needs, recognize the request IS handleable, provide
  the claim status from the API data, and resolve the call without escalating. Tests that the agent does not blindly escalate
  just because the customer initially asked for a human.
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr and successfully retrieves the customer's contract and claim
- rules:
  - Agent asks what the customer needs help with before deciding whether to escalate
- rules:
  - Agent recognizes the claim status inquiry is within its scope and does NOT escalate
- rules:
  - Agent provides the claim authorization status to the customer
- rules:
  - Agent does not successfully complete an escalation to a human agent — the customer's claim status inquiry is resolved through the IVR without a completed transfer (a failed or incomplete escalation attempt followed by IVR resolution is acceptable)
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder:
    CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE,
    RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
id: e2e_edge_case_ch_human_request_steered_to_resolution
