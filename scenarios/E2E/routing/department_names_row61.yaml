company_marker: assurantauto
customer:
  customer_id: CHI-020
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask the agent which department handles billing questions about your contract
  - Ask which department handles cancellations
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. You want to know which departments
    Assurant has and who to contact for billing and cancellation questions.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Curious and organized. Wants clear information about who to contact for different topics.
description: Agent must only refer to the four correct department names — Claims, Customer Care, Payments, Premium — and must
  not invent or use other department names
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent only refers to departments using the approved names — Claims, Customer Care, Payments, or Premium
- rules:
  - Agent does NOT use any other department names (e.g. 'Billing', 'Finance', 'Cancellations', 'Contract Team', 'Warranty
    Department')
- rules:
  - Agent calls get_contract_and_claims_data_ivr before answering the customer's questions
id: e2e_routing_department_names_approved_only
