company_marker: assurantauto
customer:
  customer_id: RF-004
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Tell the agent you need to start a new claim and have not yet submitted a Repair Order
  - When told to email the RO, ask what to expect after sending it
  knowledge: You are calling from Desert Automotive Group. A customer brought in a 2022
    Toyota RAV4 (VIN 2T3RWRFV5NW200004, last 8 NW200004, contract VSC200004) with
    transmission slipping at 41,000 miles. You have not yet submitted a Repair Order.
    You want to know how to start the claim process. If asked your caller type, say
    repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and receptive. Open to using digital tools if it streamlines the process. Will ask follow-up questions to confirm the process is completed correctly the first time.
description: Repair facility starting a new claim with no RO submitted — agent should
  direct them to email the RO to ro@autoclaims.com and explain they will receive a
  case number by email response to use for filing online
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent directs the repair facility to email the Repair Order to ro@autoclaims.com
- rules:
  - Agent explains the caller will receive an email response with a case number within
    a few minutes
- rules:
  - Agent explains the caller can use that case number to file the claim online
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
