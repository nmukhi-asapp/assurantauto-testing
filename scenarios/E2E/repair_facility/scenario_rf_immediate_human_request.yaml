company_marker: assurantauto
customer:
  customer_id: RF-020
  evaluation_goals: null
  goals:
  - When the agent asks your caller type, say you are a repair facility
  - Immediately say you need to speak to a live agent 
  - If the agent asks what you need help with, explain that Assurant denied authorization on a claim and you want
    to dispute the decision with a supervisor directly
  - If the agent tries to handle the dispute through the IVR, insist you need a person
  knowledge: You are calling from Summit Auto Service. A claim (37020020A) for a 2022 Toyota Camry (VIN
    4T1BF1FK5CU200020, last 8 CU200020, contract VSC200020) was denied and you believe it should have been
    authorized. You want to dispute the decision with a supervisor. If asked your caller type, say repair facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Professional and assertive. Has dealt with Assurant before. Knows a supervisor can override decisions. Not interested in IVR self-service for this type of issue.
description: "Repair facility immediately requests a live agent to dispute a denied
  authorization decision — something the IVR cannot resolve. Agent should ask what
  the caller needs before escalating, recognize the claim dispute is outside IVR
  scope, and escalate via escalate_to_agent_from_ivr."
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent asks what the caller needs help with before escalating, rather than blindly escalating on the request alone
- rules:
  - Agent recognizes the authorization dispute cannot be resolved through the IVR and escalates using escalate_to_agent_from_ivr, OR informs the customer that agents are not currently available due to business hours
- rules:
  - Agent informs the caller they will be connected to the appropriate team, OR informs the customer that agents are not currently available due to business hours
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility: CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
