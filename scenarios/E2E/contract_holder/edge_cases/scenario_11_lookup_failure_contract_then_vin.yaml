company_marker: assurantauto
customer:
  customer_id: CHI-031
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Contract Holder
  - Ask for help with your service contract
  - When the agent asks for a contract number, claim number, or VIN, say your contract number is 'VSC999031'
  - If the agent asks what type of number that is, say it is your contract number
  - When the agent reads back the number and asks you to confirm, say yes
  - If the first lookup fails and the agent asks for a different identifier, provide the last 8 characters of your VIN as 'ZA999031'
  - When the agent reads back the VIN and asks you to confirm, say yes
  knowledge: If asked to identify yourself as a caller type, say you are a Contract Holder. Your contract number is VSC999031.
    Your last 8 VIN digits are ZA999031. Start by saying 'I need help with my service contract.'
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Cooperative and patient. Willing to provide any information the agent asks for.
description: "Initial ANI lookup returns success: false. Agent asks for a manual identifier
  (Step A). Customer provides contract number, confirms it (Step C). Agent calls get_contract_and_claims_data_ivr
  with the contract number — that lookup fails (Step E). Agent asks for a different identifier. Customer provides
  last 8 of VIN, confirms it. Agent calls get_contract_and_claims_data_ivr with the VIN — that also fails. Agent
  escalates via Unified Escalation Protocol after two failed identifier attempts."
evaluations:
- rules:
  - Agent routes to the Contract Holder service flow after customer identifies as a Contract Holder
- rules:
  - Agent calls get_contract_and_claims_data_ivr using the PhoneNumber and receives a failure response
- rules:
  - Agent asks the customer to provide their claim number, contract number, or the last 8 characters of their VIN
- rules:
  - After the API lookup with the contract number returns a not-found / failure response, the agent reads back the contract number to the customer and asks them to confirm before retrying with a different identifier
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the contract number and receives a not-found or failure response
- rules:
  - Agent informs the customer it could not find a record with that contract number and asks for a different identifier
- rules:
  - After the API lookup with the VIN returns a not-found / failure response, the agent reads back the VIN to the customer and asks them to confirm before retrying with a different identifier
- rules:
  - Agent calls get_contract_and_claims_data_ivr with the VIN and receives a not-found or failure response
- rules:
  - Agent escalates using escalate_to_agent_from_ivr after two failed customer-provided identifier lookup attempts (the initial automatic phone number lookup does not count)
- rules:
  - Agent apologizes and informs the customer they will be connected to a specialist
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - "If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Contract Holder: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, CONTRACTCHANGES, COVERAGEINFO, GAP, LOCATE_RF, PAYMENT, ROADSIDE_ASSISTANCE, RV, GA_ERROR, PREMIUMS, ALLOTHER_QUESTIONS, DEFAULT"
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Contract Holder'
