company_marker: assurantauto
customer:
  customer_id: DLR-021
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant
    Employee, say you are a Dealership
  - Start by saying you need to talk to a person
  - When the agent asks what you need help with, say you need to confirm a claim is
    authorized before proceeding with a repair
  - When offered the portal, say you prefer to handle it over the phone
  - Provide your contract number VSC300021 when asked for an identifier
  - When the agent reads back the contract number and asks you to confirm, say yes
  - Accept the authorization status when the agent provides it
  knowledge: You are calling from Riverside Auto Group. A customer brought in their
    2022 Ford Explorer (VIN 1FM5K8D83NGA00021, last 8 NGA00021, contract VSC300021)
    for a fuel pump failure. You submitted claim 37030021 and want to confirm it is
    authorized before ordering parts. Your dealer ID is 000CA099. If asked your caller
    type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Professional dealership service advisor. Asks
    for a human out of routine, but is cooperative once the agent demonstrates it
    can look up the claim directly over the phone.
description: Dealership opens with a human agent request, but their actual need —
  confirming claim authorization status — is fully within the IVR's scope. Agent should
  ask what the caller needs, recognize the request is handleable, look up the claim
  using the provided contract number, and communicate the authorization status without
  escalating.
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent asks what the caller needs help with before deciding whether to escalate
- rules:
  - Caller states they need to confirm claim authorization status
- rules:
  - Agent recognizes the claim status inquiry is within its scope and does NOT escalate
- rules:
  - Agent asks for a claim identifier and looks up the claim using an available claim
    lookup function
- rules:
  - Agent provides the authorization status and informs the caller the authorization
    letter was sent
- rules:
  - Agent does NOT transfer to a human agent
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of
    the valid values for Dealership: CANCELLATION, CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT, RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Selling Dealer'
