company_marker: assurantauto
customer:
  customer_id: DLR-007
  evaluation_goals: null
  goals:
  - When the agent asks you to identify your caller type, say you are a Dealership
  - Ask about starting a new claim for a customer vehicle
  knowledge: You are calling from Westside Auto Group. A customer (VIN 4T1BF1FK5HU300007,
    contract VSC300007) brought in their 2017 Toyota Camry for a brake issue. If asked
    your caller type, say Dealership.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results
    ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers
    before a response ("Uh,", "Yeah,"). Professional dealership service advisor.
description: Dealership caller — agent welcome message and caller type identification
  must use correct, professional terminology without awkward phrasing or grammatical
  errors
evaluations:
- rules:
  - Agent uses clear and correct terminology when asking the caller to identify as
    a Contract Holder, Dealership, or Assurant Employee
- rules:
  - Agent does not use duplicated words or garbled phrasing in its opening or routing
    messages
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
