company_marker: assurantauto
customer:
  customer_id: RT-LENDER-001
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a customer, dealer, or repair facility, respond
    with "Bank" or "I'm a lender"
  - If the agent repeats the same identification question or gives you the same options
    again, clarify that you work for Truist as a lender — not a customer, dealer,
    or repair facility
  - If the agent says there is no routing available for your caller type or transfers
    you, accept that and end the call
  knowledge: You are a representative from Truist Bank calling as a lender about a
    customer's auto warranty contract. You are not a contract holder, dealer, repair
    facility, or Assurant employee. When asked to identify yourself, say you are from
    a bank or calling as a lender.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words.
    Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's
    correct."). For open-ended questions, gives a direct fragment of 5-8 words — never
    full sentences, never explanations. Never volunteers context or reasons. Occasional
    natural fillers before a response ("Uh,", "Yeah,"). Somewhat confused about why
    the IVR cannot help them, but ultimately accepts the situation.
description: Lender caller (Truist bank employee) — agent must recognise the out-of-scope
  caller type after at most one clarification and handle gracefully, without looping
  on the identification question
evaluations:
- rules:
  - The agent calls change_task with task_name ContractHolderIssues to route the lender
    caller into the contract holder flow
- rules:
  - The caller is escalated to a human agent (escalate_to_live_agent or escalate_to_agent_from_ivr
    is called) before the conversation ends
