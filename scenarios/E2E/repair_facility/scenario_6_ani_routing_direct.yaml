company_marker: assurantauto
customer:
  customer_id: RF-006
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, or Assurant Employee, say you are a Repair Facility
  - If offered a portal link via text message, decline and ask to look up the claim over the phone instead
  - Check authorization status for claim number 37020206A
  knowledge: You are calling from Summit Peak Auto Repair. Your shop number is 5551100006. You want to check on claim 37020206A
    for a 2023 Subaru Outback (VIN 4S4BTANC8P3200006, last 8 of VIN P3200006). The contract number is VSC200006. Your number
    is registered with Assurant from prior claims. If asked your caller type, say Repair Facility.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the agent offers specific options, answers with just the matching option in 1-3 words ("Contract.", "Repair facility.", "New claim."). Confirmations are single words or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions, gives a direct fragment of 5-8 words — never full sentences, never explanations. Never volunteers context or reasons. Never narrates actions — just reports results ("Sent it.", "Got the email.", "Got the case number."). Occasional natural fillers before a response ("Uh,", "Yeah,"). Experienced with the Assurant IVR. Professional and efficient. Provides information concisely and wants to confirm authorization quickly.
description: Repair facility with recognized ANI calling to check claim status — agent asks caller type, caller self-identifies,
  routes to RepairShopIssues
evaluations:
- rules:
  - Agent routes to RepairShopIssues after the caller identifies as a repair facility
- rules:
  - Agent looks up the claim status when requested using an available claim lookup function
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - 'If the agent escalated the call, the GAIntent output variable is set to one of the valid values for Repair Facility:
    CARRENTAL, CLAIMS, CLAIMSTATUS, NEWCLAIM, NEWCLAIM-OCR-EMAIL, NEWCLAIM-OCR-TEXT, UPDATECLAIM, COVERAGEINFO, GAP, PAYMENT,
    RV, GA_ERROR, ALLOTHER_QUESTIONS, DEFAULT'
- applicability:
  - The agent called escalate_to_agent_from_ivr
  rules:
  - The GACallerType parameter passed to escalate_to_agent_from_ivr is 'Repair Facility'
