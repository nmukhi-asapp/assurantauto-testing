company_marker: assurantauto
customer:
  customer_id: DLR-014
  evaluation_goals: null
  goals:
  - When the agent asks whether you are a Contract Holder, Dealership, Repair Facility, or Assurant Employee, say you are a Dealership
  - When asked what you need help with, say you need to adjust an existing claim
  - When the agent asks for the claim number, contract number, or VIN, say the case number is 49137123
  - If the agent asks you to confirm the case number, confirm it is correct
  - Accept the claim status or being transferred to someone who can help
  knowledge: You are calling from Westside Motors. You want to adjust an existing claim.
    When asked for a claim number, contract number, or VIN, you will provide a case number
    (49137123). You do not have a claim number, contract number, or VIN handy.
  personality: Responds like a real caller on a phone IVR. Extremely terse. When the
    agent offers specific options, answers with just the matching option in 1-3 words
    ("Contract.", "Repair facility.", "New claim."). Confirmations are single words
    or short phrases only ("Yes.", "Yeah.", "That's correct."). For open-ended questions,
    gives a direct fragment of 5-8 words — never full sentences, never explanations.
    Never volunteers context or reasons. Never narrates actions — just reports results.
    Occasional natural fillers before a response ("Uh,", "Yeah,").
description: >
  Dealership provides a case number when asked for a claim/contract/VIN. Agent should
  recognize "case number" as a distinct identifier type and call the getClaims API
  with it directly — NOT ask the caller to clarify whether it is a claim number,
  contract number, or VIN.
evaluations:
- rules:
  - Agent routes to DealershipIssues after the caller identifies as a Dealership
- rules:
  - Agent categorizes the inquiry as an existing claim issue
- rules:
  - >
    After the caller explicitly identifies their number as a case number (e.g., says
    "case number 49137123"), the agent does NOT follow up by asking whether that number
    is a claim number, contract number, or VIN. The agent proceeds directly to confirm
    and look up the number without re-requesting the identifier type.
- rules:
  - Agent calls get_claims_case_number or getClaimsClaimNumber with the case number
    provided by the caller, without first asking the caller to re-identify the number
    type
- rules:
  - Agent presents claim status to the caller or escalates, using the data returned
    by the lookup
